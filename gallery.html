<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Birthday Gallery</title>
    <style>
        /* Modern Premium CSS */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0f1115; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        .hidden { display: none !important; }

        /* --- Login Section --- */
        #login-section { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100%; }
        .login-box { background: #1a1d24; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 400px; border: 1px solid #2a2d35; }
        .login-box h2 { margin-bottom: 8px; font-weight: 600; }
        .login-box p { color: #8b92a5; margin-bottom: 24px; font-size: 14px; }
        
        .input-group { display: flex; flex-direction: column; gap: 15px; }
        input[type="password"] { padding: 14px; border-radius: 8px; border: 1px solid #333842; background: #0f1115; color: white; font-size: 16px; outline: none; transition: 0.3s; }
        input[type="password"]:focus { border-color: #3b82f6; }
        
        button { padding: 14px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }
        #error-msg { color: #ef4444; font-size: 14px; margin-top: 15px; min-height: 20px; }

        /* --- Gallery Section --- */
        #gallery-section { width: 100%; max-width: 1200px; padding: 40px 20px; }
        .gallery-header { text-align: center; margin-bottom: 40px; }
        .gallery-header h1 { font-size: 28px; margin-bottom: 10px; }
        .gallery-header p { color: #8b92a5; }
        
        /* Grid Layout for Photos */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .photo-card { background: #1a1d24; border-radius: 12px; padding: 15px; border: 1px solid #2a2d35; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .photo-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        
        .photo-card img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 8px; margin-bottom: 15px; background: #2a2d35; }
        
        .download-btn { width: 100%; padding: 10px 0; background: #10b981; color: white; text-align: center; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .download-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-section">
        <div class="login-box">
            <h2>Secure Gallery</h2>
            <p>Enter the password to access photos</p>
            <div class="input-group">
                <input type="password" id="pass-input" placeholder="Enter Password" autocomplete="off">
                <button id="unlock-btn">Unlock Vault</button>
            </div>
            <p id="error-msg"></p>
        </div>
    </div>

    <!-- GALLERY SCREEN -->
    <div id="gallery-section" class="hidden">
        <div class="gallery-header">
            <h1>🎂 Birthday Photo Vault</h1>
            <p>Select and download your favorite pictures.</p>
        </div>

        <div class="grid-container">
            
            <!-- Photo 1 -->
            <div class="photo-card">
                <img src="photo1.jpg" alt="Photo 1">
                <a href="photo1.jpg" download="Birthday_Pic_1.jpg" class="download-btn">⬇️ Download</a>
            </div>

            <!-- Photo 2 -->
            <div class="photo-card">
                <img src="photo2.jpg" alt="Photo 2">
                <a href="photo2.jpg" download="Birthday_Pic_2.jpg" class="download-btn">⬇️ Download</a>
            </div>

            <!-- Photo 3 -->
            <div class="photo-card">
                <img src="photo3.jpg" alt="Photo 3">
                <a href="photo3.jpg" download="Birthday_Pic_3.jpg" class="download-btn">⬇️ Download</a>
            </div>

            <!-- Tum yahan aur photos add kar sakte ho same structure copy karke -->

        </div>
    </div>

    <script>
        const unlockBtn = document.getElementById('unlock-btn');
        const passInput = document.getElementById('pass-input');
        const errorMsg = document.getElementById('error-msg');
        
        const loginSection = document.getElementById('login-section');
        const gallerySection = document.getElementById('gallery-section');

        // Yahan Apna Password Set Karo
        const SECRET_PASSWORD = "bro"; 

        function checkPassword() {
            const enteredPass = passInput.value.trim().toLowerCase(); // lowercase for easy matching
            
            if (enteredPass === SECRET_PASSWORD) {
                // Correct Password -> Show Gallery
                loginSection.classList.add('hidden');
                gallerySection.classList.remove('hidden');
                
                // Optional: Scroll to top smoothly
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                // Wrong Password
                errorMsg.innerText = "Incorrect password! Try again.";
                passInput.value = "";
                passInput.focus();
                
                // Clear error after 2 seconds
                setTimeout(() => { errorMsg.innerText = ""; }, 2000);
            }
        }

        // Click button pe check karega
        unlockBtn.addEventListener('click', checkPassword);

        // Enter key dabane pe bhi check karega
        passInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>

</body>
</html>
