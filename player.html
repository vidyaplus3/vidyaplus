<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VidyaPlus Player</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/classroom.css">
    <link rel="stylesheet" href="css/player.css">
    
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: var(--bg-color); }
        .player-page-container { display: flex; flex-direction: column; height: 100%; width: 100%; }
        @media (min-width: 768px) {
            .player-page-container { flex-direction: row; padding: 20px; gap: 20px; align-items: stretch; }
            .video-fixed-box { flex: 2.5; max-height: none; border-radius: 16px; }
            .interaction-area { margin-top: 0; border-radius: 16px; height: auto; }
        }
    </style>
</head>
<body>
    <div class="player-page-container classroom-overlay active" id="classroom-mode">
        <div class="video-fixed-box" id="video-container">
            <div class="close-classroom" onclick="window.history.back()"><i class="fas fa-arrow-left"></i></div>
            
            <div style="width: 100%; height: 100%; pointer-events: none; overflow: hidden; position: relative;" id="player-wrapper">
                <div id="yt-player" style="width: 100%; height: 100%;"></div>
                <video id="hls-player" class="video-js vjs-default-skin" style="width: 100%; height: 100%; display: none;" playsinline></video>
            </div>
            
            <div class="tap-indicator left" id="tap-indicator-left"><i class="fas fa-undo"></i> 10s</div>
            <div class="tap-indicator right" id="tap-indicator-right"><i class="fas fa-redo"></i> 10s</div>

            <div class="security-shield" onclick="handleShieldClick()" oncontextmenu="return false;" style="position: absolute; inset: 0; z-index: 10; cursor: pointer;"></div>
            <div id="video-watermark" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; color: rgba(255,255,255,0.2); font-weight: 800; font-size: 0.8rem; z-index: 50;">VidyaPlus Secure</div>

            <div class="custom-controls" id="custom-controls">
                <div class="controls-row-top" style="display: flex; align-items: center; gap: 14px; width: 100%;">
                    <div class="time-display" id="time-current">0:00</div>
                    <div class="progress-bar-bg" id="progress-bg" onmousedown="startDrag(event)" onmousemove="doDrag(event)" onmouseup="stopDrag(event)" onmouseleave="stopDrag(event)" ontouchstart="startDrag(event)" ontouchmove="doDrag(event)" ontouchend="stopDrag(event)"><div class="progress-fill" id="progress-fill"></div><div class="progress-tooltip" id="progress-tooltip">0:00</div></div>
                    <div class="time-display" id="time-duration">0:00</div>
                </div>
                <div class="controls-row-bottom" style="display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 5px;">
                    <div class="ctrl-group-left" style="display: flex; align-items: center; gap: 20px;">
                        <button class="ctrl-btn" onclick="togglePlay()"><i class="fas fa-play" id="play-icon"></i></button>
                        <button class="ctrl-btn skip-btn" onclick="skipVideo(-10)"><i class="fas fa-undo"></i><span class="skip-label">10</span></button>
                        <button class="ctrl-btn skip-btn" onclick="skipVideo(10)"><i class="fas fa-redo"></i><span class="skip-label">10</span></button>
                        <div class="volume-wrapper" style="display: flex; align-items: center; gap: 10px;">
                            <button class="ctrl-btn" onclick="toggleMute()"><i class="fas fa-volume-mute" id="mute-icon"></i></button>
                            <div class="volume-slider-container" style="width: 75px; display: flex; align-items: center;"><input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="0" style="background: linear-gradient(to right, #FFFFFF 0%, rgba(255, 255, 255, 0.25) 0%);" oninput="window.setVolume && window.setVolume(this.value)"></div>
                        </div>
                    </div>
                    <div class="ctrl-group-right" style="display: flex; align-items: center; gap: 20px;">
                        <button class="ctrl-btn" onclick="toggleSettings(event)"><i class="fas fa-cog"></i></button>
                        <button class="ctrl-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
                
                <div class="settings-menu" id="settings-menu" onclick="event.stopPropagation()">
                    <div class="settings-menu-item" onclick="document.getElementById('speed-dropdown').classList.toggle('show'); document.getElementById('quality-dropdown').classList.remove('show');">
                        <span>Playback Speed</span>
                        <i class="fas fa-chevron-down" style="font-size: 0.7rem; opacity: 0.5;"></i>
                    </div>
                    <div class="settings-submenu-list" id="speed-dropdown">
                        <div class="speed-opt" id="spd-0.75" onclick="setSpeed(0.75)">0.75x</div>
                        <div class="speed-opt active" id="spd-1" onclick="setSpeed(1)">Normal</div>
                        <div class="speed-opt" id="spd-1.25" onclick="setSpeed(1.25)">1.25x</div>
                        <div class="speed-opt" id="spd-1.5" onclick="setSpeed(1.5)">1.5x</div>
                        <div class="speed-opt" id="spd-2" onclick="setSpeed(2)">2x</div>
                    </div>
                    <div class="settings-menu-item" onclick="document.getElementById('quality-dropdown').classList.toggle('show'); document.getElementById('speed-dropdown').classList.remove('show');">
                        <div>Quality <span class="badge-na" id="quality-badge" style="display:none;">AUTO</span></div>
                        <i class="fas fa-chevron-down" style="font-size: 0.7rem; opacity: 0.5;"></i>
                    </div>
                    <div class="settings-submenu-list" id="quality-dropdown">
                        <div class="quality-opt active" onclick="window.setQuality && window.setQuality('auto')">Auto</div>
                        <div class="quality-opt" onclick="window.setQuality && window.setQuality('1080')">1080p</div>
                        <div class="quality-opt" onclick="window.setQuality && window.setQuality('720')">720p</div>
                        <div class="quality-opt" onclick="window.setQuality && window.setQuality('480')">480p</div>
                    </div>
                </div>
            </div>
        </div> 
        
        <div class="interaction-area">
            <div class="classroom-tabs">
                <div class="tab-pill active" id="tab-comments" onclick="switchClassroomTab('comments')"><i class="fas fa-comments"></i> Discussion</div>
                <div class="tab-pill" id="tab-notes" onclick="switchClassroomTab('notes')"><i class="fas fa-file-pdf"></i> Notes</div>
                <div class="tab-pill" id="tab-dpp" onclick="switchClassroomTab('dpp')"><i class="fas fa-tasks"></i> Practice</div>
            </div>
            <div class="tab-content-area" id="classroom-dynamic-content"></div>
        </div>
    </div>

    <div class="pdf-overlay" id="pdf-mode">
        <div class="pdf-header">
            <div class="pdf-back" onclick="closePDF()"><i class="fas fa-arrow-left"></i></div>
            <div class="pdf-title-box">
                <h3 id="pdf-dyn-title">Study Notes</h3>
                <span class="pdf-badge">SECURE READER</span>
            </div>
            <div class="pdf-actions">
                <button class="pdf-action-btn" onclick="togglePDFFull()"><i class="fas fa-expand"></i></button>
            </div>
        </div>
        <div class="pdf-container" id="pdf-viewer-container">
            <iframe id="pdf-iframe" src="" allow="autoplay"></iframe>
            <div class="pdf-shield" oncontextmenu="return false;"></div>
            <div class="pdf-watermark" id="pdf-watermark-text">Vidyaplus Secure</div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-quality-levels@4.1.0/dist/videojs-contrib-quality-levels.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-http-source-selector@1.1.6/dist/videojs-http-source-selector.min.js"></script>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/analytics/engine.js"></script>
    
    <script type="module">
        import { VideoPlayer } from './js/player/index.js';
        import { auth } from './js/firebase-init.js';
        import { AppState } from './js/auth.js'; 
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        window.addEventListener('DOMContentLoaded', () => {
            const vidUrl = sessionStorage.getItem('vp_secure_vid');
            const title = sessionStorage.getItem('vp_secure_title');
            const pdfUrl = sessionStorage.getItem('vp_secure_pdf');
            const chapter = sessionStorage.getItem('vp_secure_chapter');
            
            if (!vidUrl) {
                window.location.replace('study.html');
                return;
            }

            // 1. Pehle Firebase Auth ka wait karein
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    if (AppState && chapter) {
                        AppState.currentChapter = chapter;
                    }

                    let pollingAttempts = 0;
                    function checkEnginesAndStart() {
                        let isYoutube = vidUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?]+)/);
                        
                        if (isYoutube) {
                            if (typeof YT !== 'undefined' && YT.Player) {
                                VideoPlayer.openVideo(vidUrl, title, pdfUrl);
                                setTimeout(() => {
                                    if (typeof window.switchClassroomTab === 'function') {
                                        window.switchClassroomTab('comments');
                                    }
                                }, 150);
                            } else {
                                pollingAttempts++;
                                if (pollingAttempts < 50) setTimeout(checkEnginesAndStart, 100);
                            }
                        } else {
                            if (typeof videojs !== 'undefined') {
                                VideoPlayer.openVideo(vidUrl, title, pdfUrl);
                                setTimeout(() => {
                                    if (typeof window.switchClassroomTab === 'function') {
                                        window.switchClassroomTab('comments');
                                    }
                                }, 150);
                            } else {
                                pollingAttempts++;
                                if (pollingAttempts < 50) setTimeout(checkEnginesAndStart, 100);
                            }
                        }
                    }
                    checkEnginesAndStart();
                } else {
                    window.location.replace('/');
                }
            });
        });
    </script>
</body>
</html>
