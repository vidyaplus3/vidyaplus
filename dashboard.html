<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Portal | VidyaPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- PREMIUM DESIGN SYSTEM & VARIABLES --- */
        :root {
            --bg-color: #F8FAFC; /* Softer, premium light background */
            --surface: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --primary: #3B82F6; 
            --primary-hover: #2563EB;
            --primary-light: #EFF6FF;
            --success: #10B981;
            --border-color: #E2E8F0;
            --header-bg: #0F172A; /* Dark theme from Study section */
            
            /* Sleek Shadows */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            
            --header-height: 64px;
            --sidebar-width: 240px;
            --bottom-nav-height: 60px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

        /* --- AUTH GUARD --- */
        #authGuard {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--surface); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
        }
        .loader-ring {
            width: 36px; height: 36px; border: 3px solid var(--border-color);
            border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- LAYOUT ARCHITECTURE --- */
        #appLayout { display: none; flex-direction: column; min-height: 100vh; }

        /* --- DARK PREMIUM HEADER (From Study Section) --- */
        .header {
            height: var(--header-height); 
            background: var(--header-bg); 
            padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between;
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            box-shadow: var(--shadow-sm);
        }
        
        .header-left { display: flex; align-items: center; gap: 2rem; flex: 1; }
        .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; flex-shrink: 0; }
        .logo i { color: var(--primary); font-size: 1.4rem; }
        .logo span { font-size: 1.25rem; font-weight: 700; color: #FFFFFF; letter-spacing: -0.3px; }

        /* Header Right Actions */
        .header-actions { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
        .icon-btn { position: relative; background: none; border: none; font-size: 1.1rem; color: #94A3B8; cursor: pointer; transition: color 0.2s; padding: 4px; }
        .icon-btn:hover { color: #FFFFFF; }
        .badge { position: absolute; top: 0; right: 0; background: var(--primary); color: white; font-size: 0.6rem; font-weight: 600; padding: 2px 4px; border-radius: 4px; border: 2px solid var(--header-bg); line-height: 1; }

        .profile-container { position: relative; margin-left: 0.5rem; }
        .user-avatar { width: 32px; height: 32px; background: #1E293B; color: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.875rem; cursor: pointer; border: 1px solid #334155; transition: all 0.2s; }
        .user-avatar:hover { border-color: var(--primary); }
        
        .profile-dropdown {
            position: absolute; right: 0; top: calc(100% + 8px);
            background: var(--surface); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); box-shadow: var(--shadow-md); width: 180px;
            display: flex; flex-direction: column; opacity: 0; visibility: hidden;
            transform: translateY(-8px); transition: all 0.2s ease;
            z-index: 1001; overflow: hidden; padding: 4px;
        }
        .profile-dropdown.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-item {
            padding: 8px 12px; text-decoration: none; color: var(--text-main);
            font-size: 0.875rem; font-weight: 500; display: flex; align-items: center; gap: 8px;
            background: none; border: none; text-align: left; cursor: pointer; border-radius: 6px; transition: background 0.2s;
        }
        .dropdown-item:hover { background: var(--bg-color); }
        .dropdown-item i { width: 16px; text-align: center; color: var(--text-muted); font-size: 0.875rem; }
        .dropdown-item.logout { margin-top: 4px; border-top: 1px solid var(--border-color); color: #EF4444; border-radius: 0 0 6px 6px; }
        .dropdown-item.logout i { color: #EF4444; }
        .dropdown-item.logout:hover { background: #FEF2F2; }

        /* --- SIDEBAR --- */
        .content-wrapper { display: flex; flex: 1; margin-top: var(--header-height); }
        .sidebar {
            width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border-color);
            position: fixed; top: var(--header-height); bottom: 0; left: 0;
            padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 4px; z-index: 990; overflow-y: auto;
        }
        .nav-label { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; margin-top: 12px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 8px 12px;
            text-decoration: none; color: var(--text-muted); font-weight: 500;
            border-radius: 8px; transition: all 0.2s ease; font-size: 0.875rem;
        }
        .nav-item:hover { background: var(--bg-color); color: var(--text-main); }
        .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .nav-item i { width: 20px; text-align: center; font-size: 1rem; }

        /* --- MAIN DASHBOARD WORKSPACE --- */
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 2rem; max-width: 1400px; }

        /* Clean Header & Sleek Stats */
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        
        .greeting h1 { 
            font-size: 1.5rem; 
            font-weight: 700; 
            color: var(--text-main); 
            letter-spacing: -0.02em; 
            display: flex; 
            align-items: center; 
            gap: 12px;
        }
        .greeting h1::before {
            content: '';
            display: block;
            width: 4px;
            height: 22px;
            background: var(--primary);
            border-radius: 4px;
        }
        
        .stats-container { display: flex; gap: 1rem; }
        .stat-card { 
            background: var(--surface); 
            padding: 0.75rem 1rem; 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border-color); 
            display: flex; align-items: center; gap: 12px; 
            box-shadow: var(--shadow-md);
            min-width: 140px;
        }
        .stat-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .stat-info { display: flex; flex-direction: column; }
        .stat-value { font-size: 1rem; font-weight: 700; color: var(--text-main); line-height: 1.1; margin-bottom: 2px; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

        /* Section Titles */
        .section-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); }
        .view-all { font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 4px; transition: color 0.2s; }
        .view-all:hover { color: var(--primary-hover); }

        /* --- PREMIUM COMPACT BATCH CARDS --- */
        /* Changed grid to make cards smaller and neater */
        .batch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
        
        @keyframes premiumFadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .batch-card {
            background: var(--surface); 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-lg);
            overflow: hidden; 
            display: flex; flex-direction: column;
            box-shadow: var(--shadow-md);
            opacity: 0; 
            animation: premiumFadeUp 0.5s ease forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        
        .batch-card:hover { 
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover); 
            border-color: #CBD5E1; 
        }
        
        /* Sleeker image wrapper */
        .card-img-wrapper { width: 100%; height: 110px; overflow: hidden; background: var(--bg-color); }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .batch-card:hover .card-img { transform: scale(1.05); }
        
        .card-body { padding: 1rem; display: flex; flex-direction: column; flex-grow: 1; }
        
        .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-main); line-height: 1.3; flex-grow: 1; }
        
        .btn-outline { width: 100%; text-align: center; border: 1px solid var(--border-color); background: var(--surface); color: var(--text-main); padding: 8px; border-radius: 8px; font-weight: 500; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; }
        .btn-outline:hover { background: var(--bg-color); border-color: #CBD5E1; }

        /* Button styles for fallbacks */
        .btn-primary { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 500; font-size: 0.85rem; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: var(--primary-hover); }

        /* --- SKELETON LOADERS --- */
        .skeleton { background: #E2E8F0; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; border-radius: var(--radius-lg); }
        .skel-card { height: 210px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- MOBILE NAVIGATION --- */
        .bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(8px); height: var(--bottom-nav-height); border-top: 1px solid var(--border-color);
            z-index: 1000; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom);
        }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--text-muted); font-size: 0.7rem; font-weight: 500; flex: 1; }
        .bottom-nav-item.active { color: var(--primary); }
        .bottom-nav-item i { font-size: 1.1rem; }

        @media (max-width: 1024px) {
            .main-content { padding: 1.5rem; }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .bottom-nav { display: flex; }
            .main-content { margin-left: 0; padding: 1rem; padding-bottom: calc(var(--bottom-nav-height) + 1.5rem); }
            
            .header { padding: 0 1rem; gap: 1rem; }
            .header-left { gap: 1rem; }
            
            .dashboard-header { flex-direction: column; align-items: flex-start; gap: 1.25rem; }
            .stats-container { width: 100%; flex-wrap: wrap; }
            .stat-card { flex: 1; min-width: calc(50% - 0.5rem); }
            .batch-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }
    </style>
</head>
<body>
    <div id="authGuard">
        <div class="loader-ring"></div>
    </div>

    <div id="appLayout">
        
        <header class="header">
            <div class="header-left">
                <a href="dashboard.html" class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>VidyaPlus</span>
                </a>
            </div>
            
            <div class="header-actions">
                <button class="icon-btn"><i class="fas fa-bell"></i><span class="badge">0</span></button>
                <div class="profile-container">
                    <div class="user-avatar" id="profileToggle">S</div>
                    <div class="profile-dropdown" id="profileDropdown">
                        <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> Account Profile</a>
                        <button class="dropdown-item logout" onclick="logoutSystem()"><i class="fas fa-sign-out-alt"></i> Log Out</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            <nav class="sidebar">
                <div class="nav-label">Curriculum</div>
                <a href="dashboard.html" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="explore.html" class="nav-item"><i class="fas fa-compass"></i> Course Catalog</a>
                <a href="study.html" class="nav-item"><i class="fas fa-book"></i> Study Area</a>
                
                <div class="nav-label">Assessments</div>
                <a href="#" class="nav-item"><i class="fas fa-file-alt"></i> Mock Tests</a>
                <a href="#" class="nav-item"><i class="fas fa-robot"></i> AI Assistant</a>
                <a href="#" class="nav-item"><i class="fas fa-chart-bar"></i> Performance</a>

                <div class="nav-label">Account</div>
                <a href="profile.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
                <a href="#" class="nav-item" onclick="logoutSystem()" style="color: #EF4444;"><i class="fas fa-sign-out-alt"></i> Log Out</a>
            </nav>

            <main class="main-content">
                
                <div class="dashboard-header">
                    <div class="greeting">
                        <h1>Dashboard Overview</h1>
                        <span id="user-display-name" style="display: none;"></span> 
                    </div>
                    <div class="stats-container">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-calendar-check"></i></div>
                            <div class="stat-info">
                                <div class="stat-value"><span id="user-streak">0</span> Days</div>
                                <div class="stat-label">Active Streak</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon" style="color: var(--success); background: #ECFDF5;"><i class="fas fa-clock"></i></div>
                            <div class="stat-info">
                                <div class="stat-value"><span id="user-watch-time">0</span> Hrs</div>
                                <div class="stat-label">Study Time</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-title">
                    <span>Active Enrollments</span>
                    <a href="explore.html" class="view-all">Browse Catalog <i class="fas fa-arrow-right"></i></a>
                </div>

                <div class="batch-grid" id="myBatchGrid">
                    <div class="skeleton skel-card"></div>
                    <div class="skeleton skel-card"></div>
                    <div class="skeleton skel-card"></div>
                </div>

            </main>
        </div>
        
        <nav class="bottom-nav" id="bottomNav">
            <a href="dashboard.html" class="bottom-nav-item active">
                <i class="fas fa-home"></i><span>Home</span>
            </a>
            <a href="explore.html" class="bottom-nav-item">
                <i class="fas fa-compass"></i><span>Catalog</span>
            </a>
            <a href="study.html" class="bottom-nav-item">
                <i class="fas fa-book"></i><span>Study</span>
            </a>
            <a href="#" class="bottom-nav-item">
                <i class="fas fa-robot"></i><span>Assistant</span>
            </a>
        </nav>
    </div>

    <script>
        // Profile Dropdown Toggle Logic
        const profileToggle = document.getElementById('profileToggle');
        const profileDropdown = document.getElementById('profileDropdown');

        profileToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!profileDropdown.contains(e.target) && !profileToggle.contains(e.target)) {
                profileDropdown.classList.remove('active');
            }
        });

        // Bottom Nav Hide on Scroll
        let lastScrollY = window.scrollY;
        const bottomNav = document.getElementById('bottomNav');

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY && currentScrollY > 60) {
                bottomNav.style.transform = 'translateY(100%)';
            } else {
                bottomNav.style.transform = 'translateY(0)';
            }
            bottomNav.style.transition = 'transform 0.3s ease';
            lastScrollY = currentScrollY;
        }, { passive: true });
    </script>
    <script type="module">
        import { db, auth } from './js/firebase-init.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const authGuard = document.getElementById('authGuard');
        const appLayout = document.getElementById('appLayout');
        const myBatchGrid = document.getElementById('myBatchGrid');

        // Authentication State Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                let displayName = user.displayName || user.email.split('@')[0];
                document.getElementById('user-display-name').innerText = displayName;
                document.getElementById('profileToggle').innerText = displayName.charAt(0).toUpperCase();
                
                try {
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);
                    
                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        
                        const streakCount = userData.streak || 0;
                        const streakEl = document.getElementById('user-streak');
                        if (streakEl) streakEl.innerText = streakCount;
                        
                        const totalSecs = userData.totalWatchTimeSeconds || 0;
                        const totalHours = Math.floor(totalSecs / 3600);
                        const watchTimeEl = document.getElementById('user-watch-time');
                        if (watchTimeEl) watchTimeEl.innerText = totalHours;
                    }
                } catch (error) {
                    console.error("Error retrieving metrics:", error);
                }

                authGuard.style.opacity = '0';
                setTimeout(() => {
                    authGuard.style.display = 'none';
                    appLayout.style.display = 'flex';
                }, 300);

                fetchMyBatches(user.uid);
            } else {
                window.location.replace("login.html");
            }
        });

        async function fetchMyBatches(uid) {
            try {
                const enrollmentsRef = collection(db, "users", uid, "enrollments");
                const enrollmentsSnap = await getDocs(enrollmentsRef);

                myBatchGrid.innerHTML = '';

                if (!enrollmentsSnap.empty) {
                    let delayIndex = 0;
                    enrollmentsSnap.forEach(async (docSnap) => {
                        const batchId = docSnap.id; 
                        const batchRef = doc(db, "batches", batchId);
                        const batchSnap = await getDoc(batchRef);
                        
                        if (batchSnap.exists()) {
                            renderBatchCard(batchId, batchSnap.data(), delayIndex++);
                        }
                    });
                } else {
                    myBatchGrid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align:center; padding: 2rem 1.5rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg);">
                            <i class="fas fa-folder-open" style="font-size: 2rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
                            <h3 style="color: var(--text-main); font-size: 0.95rem; margin-bottom: 0.5rem; font-weight: 600;">No Active Enrollments</h3>
                            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Access the course catalog to begin a module.</p>
                            <button onclick="window.location.href='explore.html'" class="btn-primary" style="width: auto;">Browse Catalog</button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Database Query Error:", error);
                myBatchGrid.innerHTML = '<p style="color: #EF4444; grid-column: 1/-1; font-size: 0.85rem;">System Error: Unable to retrieve academic data.</p>';
            }
        }

        // Updated Render function for compact cards without extra tags
        function renderBatchCard(id, data, delayIndex) {
            const card = document.createElement('div');
            card.className = 'batch-card';
            card.style.animationDelay = `${delayIndex * 0.1}s`; 
            
            const imgUrl = data.imageUrl || 'https://via.placeholder.com/600x340/E2E8F0/64748B?text=Module+Data';

            card.innerHTML = `
                <div class="card-img-wrapper">
                    <img src="${imgUrl}" alt="Module Image" class="card-img" loading="lazy">
                </div>
                <div class="card-body">
                    <div class="card-title">${data.title}</div>
                    <button class="btn-outline" onclick="window.location.href='study.html?batch=${id}'">
                        Access Material
                    </button>
                </div>
            `;
            myBatchGrid.appendChild(card);
        }

        window.logoutSystem = function() {
            if(confirm("Confirm action: Log out of current session?")) {
                signOut(auth).then(() => {
                    window.location.replace("index.html");
                }).catch((error) => console.error(error));
            }
        };
    </script>
</body>
</html>
