<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Study | VidyaPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- CORE VARIABLES --- */
        :root {
            /* Black, White, and Brown/Amber Theme */
            --bg-color: #f9fafb; /* Very light gray/white */
            --surface: #ffffff;
            --text-main: #111827; /* Near black */
            --text-muted: #6b7280;
            --primary: #92400e; /* Sophisticated amber/brown */
            --primary-hover: #b45309;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            
            /* Navigation Heights */
            --header-height: 64px;
            --bottom-nav-height: 65px;
            --sidebar-width: 250px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER --- */
        .header {
            background: var(--surface);
            height: var(--header-height);
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { color: var(--primary); font-size: 1.5rem; }
        .logo-text { font-size: 1.4rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }

        /* Profile & Dropdown */
        .profile-container { position: relative; }
        .profile-btn {
            background: none; border: none; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            padding: 4px; border-radius: 50%; transition: 0.2s;
        }
        .user-avatar {
            width: 38px; height: 38px; background: var(--primary); color: var(--surface);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 1.1rem;
        }
        
        .profile-dropdown {
            position: absolute; right: 0; top: 50px;
            background: var(--surface); border: 1px solid var(--border-color);
            border-radius: 8px; box-shadow: var(--shadow-md);
            width: 180px; display: none; flex-direction: column;
            overflow: hidden; z-index: 1001;
        }
        .profile-dropdown.active { display: flex; }
        .dropdown-item {
            padding: 12px 16px; text-decoration: none; color: var(--text-main);
            font-size: 0.95rem; display: flex; align-items: center; gap: 10px;
            background: none; border: none; text-align: left; width: 100%; cursor: pointer;
        }
        .dropdown-item:hover { background: var(--bg-color); }
        .dropdown-item.logout { color: #dc2626; border-top: 1px solid var(--border-color); }

        /* --- LAYOUT WRAPPER --- */
        .app-body {
            display: flex;
            margin-top: var(--header-height);
            flex: 1;
        }

        /* --- DESKTOP SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: var(--header-height);
            bottom: 0;
            left: 0;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 990;
        }

        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; text-decoration: none; color: var(--text-muted);
            font-weight: 600; border-radius: 8px; transition: 0.2s;
            font-size: 0.95rem;
        }
        .nav-item:hover { background: var(--bg-color); color: var(--text-main); }
        .nav-item.active { background: #fef3c7; color: var(--primary); }
        .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; }

        /* --- MOBILE BOTTOM NAV --- */
        .bottom-nav {
            display: none; /* Hidden on desktop */
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            height: var(--bottom-nav-height);
            border-top: 1px solid var(--border-color);
            z-index: 1000;
            justify-content: space-around;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* 60fps smooth hide */
            padding-bottom: env(safe-area-inset-bottom);
        }
        .bottom-nav.hidden {
            transform: translateY(100%);
        }
        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            text-decoration: none; color: var(--text-muted);
            font-size: 0.75rem; font-weight: 600; flex: 1;
        }
        .bottom-nav-item i { font-size: 1.25rem; }
        .bottom-nav-item.active { color: var(--primary); }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 2rem;
            max-width: 1200px;
            width: 100%;
        }

        .section-header { margin-bottom: 2rem; }
        .section-header h1 { font-size: 1.75rem; color: var(--text-main); font-weight: 700; }
        .section-header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 4px; }

        /* --- MINIMAL BATCH GRID --- */
        .batch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .batch-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .batch-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .card-img { width: 100%; height: 160px; object-fit: cover; background: var(--bg-color); border-bottom: 1px solid var(--border-color); }
        
        .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card-subject { font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .card-title { font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 1rem; line-height: 1.4; flex-grow: 1; }
        
        .btn-primary {
            display: block; width: 100%; text-align: center;
            background: var(--text-main); color: var(--surface);
            padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.95rem;
            text-decoration: none; border: none; cursor: pointer; transition: 0.2s;
        }
        .btn-primary:hover { background: var(--primary); }

        .status-message { text-align: center; padding: 3rem; color: var(--text-muted); grid-column: 1/-1; border: 1px solid var(--border-color); border-radius: 12px; background: var(--surface); }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 768px) {
            .sidebar { display: none; } /* Hide desktop sidebar */
            .bottom-nav { display: flex; } /* Show mobile bottom nav */
            .main-content { margin-left: 0; padding: 1.5rem 1rem; padding-bottom: calc(var(--bottom-nav-height) + 1.5rem); }
            .header { padding: 0 1rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="dashboard.html" class="logo-container">
            <i class="fas fa-graduation-cap logo-icon"></i>
            <span class="logo-text">VidyaPlus</span>
        </a>
        
        <div class="profile-container">
            <button class="profile-btn" id="profileToggle">
                <div class="user-avatar" id="userIcon">?</div>
            </button>
            <div class="profile-dropdown" id="profileDropdown">
                <div style="padding: 12px 16px; border-bottom: 1px solid var(--border-color);">
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Signed in as</div>
                    <div id="user-email-display" style="font-size: 0.9rem; font-weight: 600; color: var(--text-main); word-break: break-all;">Loading...</div>
                </div>
                <a href="profile.html" class="dropdown-item"><i class="fas fa-user-circle"></i> View Profile</a>
                <button id="logout-action" class="dropdown-item logout"><i class="fas fa-sign-out-alt"></i> Log Out</button>
            </div>
        </div>
    </header>

    <div class="app-body">
        <nav class="sidebar">
            <a href="explore.html" class="nav-item"><i class="fas fa-compass"></i> Explore</a>
            <a href="dashboard.html" class="nav-item active"><i class="fas fa-book-open"></i> My Batches</a>
            <a href="study.html" class="nav-item"><i class="fas fa-play-circle"></i> Study</a>
        </nav>

        <main class="main-content">
            <div class="section-header">
                <h1>My Enrolled Batches</h1>
                <p>Select a batch to continue your academic progress.</p>
            </div>

            <div class="batch-grid" id="myBatchGrid">
                <div class="status-message">
                    <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 10px; color: var(--primary);"></i>
                    <br>Retrieving enrolled data...
                </div>
            </div>
        </main>
    </div>

    <nav class="bottom-nav" id="bottomNav">
        <a href="explore.html" class="bottom-nav-item">
            <i class="fas fa-compass"></i>
            <span>Explore</span>
        </a>
        <a href="dashboard.html" class="bottom-nav-item active">
            <i class="fas fa-book-open"></i>
            <span>My Batches</span>
        </a>
        <a href="study.html" class="bottom-nav-item">
            <i class="fas fa-play-circle"></i>
            <span>Study</span>
        </a>
    </nav>

    <script>
        // Profile Dropdown Toggle
        const profileToggle = document.getElementById('profileToggle');
        const profileDropdown = document.getElementById('profileDropdown');

        profileToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle('active');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!profileDropdown.contains(e.target) && !profileToggle.contains(e.target)) {
                profileDropdown.classList.remove('active');
            }
        });

        // 60fps Mobile Bottom Nav Scroll Hide/Show Logic
        let lastScrollY = window.scrollY;
        let ticking = false;
        const bottomNav = document.getElementById('bottomNav');

        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    const currentScrollY = window.scrollY;
                    
                    // Hide if scrolling down and past 50px, show if scrolling up
                    if (currentScrollY > lastScrollY && currentScrollY > 50) {
                        bottomNav.classList.add('hidden');
                    } else {
                        bottomNav.classList.remove('hidden');
                    }
                    
                    lastScrollY = currentScrollY;
                    ticking = false;
                });
                ticking = true;
            }
        }, { passive: true }); // passive: true ensures smooth scrolling performance
    </script>
    <script type="module">
        import { db, auth } from './js/firebase-init.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const myBatchGrid = document.getElementById('myBatchGrid');

        // Security Guard
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // UI Updates
                document.getElementById('user-email-display').innerText = user.email;
                document.getElementById('userIcon').innerText = user.email.charAt(0).toUpperCase();
                
                // Fetch batches
                fetchMyBatches(user.uid);
            } else {
                window.location.replace("login.html");
            }
        });

        async function fetchMyBatches(uid) {
            try {
                const enrollmentsRef = collection(db, "users", uid, "enrollments");
                const enrollmentsSnap = await getDocs(enrollmentsRef);

                myBatchGrid.innerHTML = ''; 

                if (!enrollmentsSnap.empty) {
                    enrollmentsSnap.forEach(async (docSnap) => {
                        const batchId = docSnap.id; 
                        const batchRef = doc(db, "batches", batchId);
                        const batchSnap = await getDoc(batchRef);
                        
                        if (batchSnap.exists()) {
                            renderBatchCard(batchId, batchSnap.data());
                        }
                    });
                } else {
                    showEmptyState();
                }

            } catch (error) {
                console.error("Error fetching enrolled batches:", error);
                myBatchGrid.innerHTML = '<div class="status-message" style="color:#dc2626;">Error retrieving data. Please verify your connection.</div>';
            }
        }

        function showEmptyState() {
            myBatchGrid.innerHTML = `
                <div class="status-message">
                    <p style="margin-bottom: 15px; color: var(--text-main); font-weight: 600;">No enrollments found.</p>
                    <a href="explore.html" class="btn-primary" style="display: inline-block; width: auto; padding: 10px 24px;">Explore Available Batches</a>
                </div>
            `;
        }

        function renderBatchCard(id, data) {
            const card = document.createElement('div');
            card.className = 'batch-card';
            
            const imgUrl = data.imageUrl ? data.imageUrl : 'https://via.placeholder.com/400x200?text=VidyaPlus+Academic';

            card.innerHTML = `
                <img src="${imgUrl}" alt="Batch Image" class="card-img">
                <div class="card-body">
                    <div class="card-subject">${data.subject || 'Comprehensive Study'}</div>
                    <div class="card-title">${data.title}</div>
                    <button class="btn-primary" onclick="startStudying('${id}')">Access Materials</button>
                </div>
            `;
            myBatchGrid.appendChild(card);
        }
        
        window.startStudying = function(batchId) {
            window.location.href = "study.html?batch=" + batchId;
        };
        
        document.getElementById('logout-action').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.replace("index.html");
            }).catch((error) => {
                alert("Sign-out process encountered an error.");
            });
        });
    </script>
</body>
</html>
