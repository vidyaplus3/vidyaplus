<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VidyaPlus Study Zone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==========================================================
           1. VIDYAPLUS ULTRA: DESIGN SYSTEM & CSS VARIABLES
           ========================================================== */
        :root {
            --brand-navy: #0f172a;
            --brand-navy-light: #1e293b;
            --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #db2777 100%);
            --primary-accent: #6366f1;
            --bg-root: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-surface-glass: rgba(255, 255, 255, 0.85);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --border-subtle: rgba(148, 163, 184, 0.15);
            --elevation-1: 0 2px 4px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.06);
            --elevation-2: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', system-ui, sans-serif; }

        html, body { width: 100vw; height: 100vh; background-color: var(--bg-root); color: var(--text-primary); overflow: hidden; overscroll-behavior-y: none; display: flex; justify-content: center; }

        /* FIXED DESKTOP VIEW */
        .app-container {
            width: 100%; max-width: 1200px; height: 100%;
            background: var(--bg-surface); position: relative;
            overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-tertiary); border-radius: 10px; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-root); display: flex; flex-direction: column;
            will-change: transform, opacity; transform: translate3d(100%, 0, 0); 
            transition: transform 0.4s var(--ease-out-expo), opacity 0.4s var(--ease-out-expo);
            z-index: 10; opacity: 0; pointer-events: none;
        }

        .screen.active { transform: translate3d(0, 0, 0); z-index: 20; opacity: 1; pointer-events: all; }
        .screen.background { transform: translate3d(-20%, 0, 0); opacity: 0.5; z-index: 10; }

        .screen-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 20px; scroll-behavior: smooth; }

        .premium-header {
            background: var(--bg-surface-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .btn-icon { width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; color: var(--text-primary); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease; }
        .btn-icon:hover { background: var(--border-subtle); }
        .header-title { font-size: 1.15rem; font-weight: 700; color: var(--brand-navy); }
                .dash-hero {
            background: var(--brand-navy); padding: 1.5rem 1.25rem 2rem; color: var(--bg-surface);
            border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; position: relative; z-index: 50; box-shadow: var(--elevation-2);
        }
        
        /* BATCH DROPDOWN CSS */
        .batch-selector-btn {
            display: inline-flex; align-items: center; gap: 8px; background: transparent; border: none; color: white;
            font-size: 1.25rem; font-weight: 800; cursor: pointer; margin-top: 5px; padding: 5px 0;
        }
        .batch-dropdown-menu {
            position: absolute; top: 100%; left: 1.25rem; background: white; border-radius: 12px;
            box-shadow: var(--elevation-2); min-width: 250px; overflow: hidden;
            opacity: 0; pointer-events: none; transform: translateY(-10px); transition: 0.2s; z-index: 100;
        }
        .batch-dropdown-menu.show { opacity: 1; pointer-events: all; transform: translateY(0); }
        .batch-option { padding: 12px 15px; color: var(--text-primary); font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--border-subtle); }
        .batch-option:hover { background: var(--bg-root); color: var(--primary-accent); }

        /* Responsive Grid for Desktop */
        .app-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 15px; padding: 1.5rem;
            margin-top: -15px; position: relative; z-index: 5;
        }
        .grid-item { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--text-primary); cursor: pointer; }
        .grid-icon-box { width: 55px; height: 55px; background: var(--bg-surface); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--primary-accent); box-shadow: var(--elevation-1); transition: transform 0.2s; }
        .grid-item:hover .grid-icon-box { transform: scale(0.95); }
        .grid-text { font-size: 0.8rem; font-weight: 600; text-align: center; }

        .app-tabs { display: flex; gap: 20px; padding: 0 1.25rem; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); overflow-x: auto; }
        .app-tab { padding: 12px 0; font-weight: 700; font-size: 0.95rem; color: var(--text-tertiary); cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
        .app-tab.active { color: var(--primary-accent); border-bottom-color: var(--primary-accent); }

        /* Desktop Grid for Cards */
        .list-container { padding: 1.5rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; align-content: start; }
        
        .data-card {
            background: var(--bg-surface); border-radius: 16px; padding: 1rem; display: flex; align-items: center; gap: 15px;
            box-shadow: var(--elevation-1); border: 1px solid var(--border-subtle); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .data-card:hover { transform: translateY(-2px); box-shadow: var(--elevation-2); }
        
        .subject-icon { width: 45px; height: 45px; border-radius: 12px; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; }
        .card-content { flex: 1; }
        .card-title { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .card-subtitle { font-size: 0.8rem; font-weight: 500; color: var(--text-tertiary); }

        .lecture-card { background: var(--bg-surface); border-radius: 16px; padding: 1rem; box-shadow: var(--elevation-1); border: 1px solid var(--border-subtle); }
        .lec-card-top { display: flex; gap: 15px; margin-bottom: 12px; }
        .lec-thumb { width: 120px; height: 70px; border-radius: 8px; background: var(--bg-root); position: relative; overflow: hidden; flex-shrink: 0; }
        .lec-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay { position: absolute; bottom: -8px; right: -8px; color: #ef4444; background: white; border-radius: 50%; font-size: 1.2rem; border: 2px solid white; }
        .lec-info h4 { font-size: 0.95rem; font-weight: 700; line-height: 1.3; margin-bottom: 5px; }
        .lec-meta { font-size: 0.8rem; color: var(--text-tertiary); font-weight: 600; }
        .lec-actions { display: flex; gap: 10px; }
        .btn-outline { flex: 1; padding: 8px; border: 1.5px solid var(--border-subtle); background: transparent; border-radius: 10px; font-weight: 700; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }
        .btn-outline:hover { background: var(--bg-root); }
        
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--text-tertiary); }
    </style>
</head>
<body>
    <div class="app-container" id="app-root">
        
        <div class="screen active" id="view-dashboard">
            <div class="dash-hero">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <i class="fas fa-bars" style="font-size: 1.2rem; cursor: pointer;"></i>
                    <i class="fas fa-bell" style="font-size: 1.2rem; cursor: pointer;" onclick="alert('No new notifications!')"></i>
                </div>
                <p style="font-size: 0.75rem; color: #94a3b8; font-weight: 600; letter-spacing: 0.5px;">YOUR BATCH</p>
                
                <div style="position: relative;">
                    <button class="batch-selector-btn" onclick="document.getElementById('batch-dropdown').classList.toggle('show')">
                        <span id="current-batch-name">Loading...</span>
                        <i class="fas fa-caret-down"></i>
                    </button>
                    <div class="batch-dropdown-menu" id="batch-dropdown">
                        <div class="batch-option">Loading enrolled batches...</div>
                    </div>
                </div>
            </div>

            <div class="screen-content">
                <div class="app-grid">
                    <div class="grid-item" onclick="navigateTo('view-subjects')">
                        <div class="grid-icon-box"><i class="fas fa-play-circle" style="color: #4f46e5;"></i></div>
                        <span class="grid-text">All Classes</span>
                    </div>
                    <div class="grid-item" onclick="alert('Test Engine in Phase 4')">
                        <div class="grid-icon-box"><i class="fas fa-file-alt" style="color: #0ea5e9;"></i></div>
                        <span class="grid-text">All Tests</span>
                    </div>
                    <div class="grid-item" onclick="alert('AI Doubt Guru in Phase 5')">
                        <div class="grid-icon-box"><i class="fas fa-question-circle" style="color: #db2777;"></i></div>
                        <span class="grid-text">My Doubts</span>
                    </div>
                    <div class="grid-item" onclick="alert('Community Chat in Phase 6')">
                        <div class="grid-icon-box"><i class="fas fa-users" style="color: #8b5cf6;"></i></div>
                        <span class="grid-text">Community</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="screen" id="view-subjects">
            <div class="premium-header">
                <div class="header-left">
                    <button class="btn-icon" onclick="navigateBack()"><i class="fas fa-arrow-left"></i></button>
                    <div class="header-title">All Classes</div>
                </div>
            </div>

            <div class="app-tabs">
                <div class="app-tab active" onclick="VidyaApp.switchSubjectTab('subjects', this)">Subjects</div>
                <div class="app-tab" onclick="VidyaApp.switchSubjectTab('resources', this)">Resources</div>
            </div>

            <div class="screen-content list-container" id="subject-list-container"></div>
        </div>

        <div class="screen" id="view-chapters">
            <div class="premium-header">
                <div class="header-left">
                    <button class="btn-icon" onclick="navigateBack()"><i class="fas fa-arrow-left"></i></button>
                    <div class="header-title" id="dynamic-subject-title">Subject</div>
                </div>
            </div>
            <div class="screen-content list-container" id="chapter-list-container"></div>
        </div>

        <div class="screen" id="view-classroom">
            <div class="premium-header">
                <div class="header-left">
                    <button class="btn-icon" onclick="navigateBack()"><i class="fas fa-arrow-left"></i></button>
                    <div class="header-title" id="dynamic-chapter-title">Chapter Details</div>
                </div>
            </div>

            <div class="app-tabs" style="gap: 10px; padding: 10px 1.25rem;">
                <div class="app-tab active" style="padding:6px 15px; border-radius:20px; border:none; background:var(--text-primary); color:white;" onclick="VidyaApp.filterClassroom('all', this)">All</div>
                <div class="app-tab" style="padding:6px 15px; border-radius:20px; border:1px solid var(--border-subtle); color:var(--text-primary);" onclick="VidyaApp.filterClassroom('lectures', this)">Lectures</div>
                <div class="app-tab" style="padding:6px 15px; border-radius:20px; border:1px solid var(--border-subtle); color:var(--text-primary);" onclick="VidyaApp.filterClassroom('notes', this)">Notes</div>
            </div>

            <div class="screen-content list-container" style="background: #f8fafc;" id="lecture-list-container"></div>
        </div>

    </div>
        <script type="module">
        import { db, auth } from './firebase-init.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Close dropdown when clicked outside
        window.onclick = function(event) {
            if (!event.target.closest('.batch-selector-btn')) {
                document.getElementById('batch-dropdown').classList.remove('show');
            }
        }

        class VidyaRouter {
            constructor() { this.history = ['view-dashboard']; }
            navigate(screenId, payload = null) {
                const currentScreen = document.getElementById(this.history[this.history.length - 1]);
                const nextScreen = document.getElementById(screenId);
                if (!nextScreen) return;

                this.history.push(screenId);
                currentScreen.classList.remove('active');
                currentScreen.classList.add('background');
                nextScreen.classList.remove('background');
                nextScreen.classList.add('active');

                if (payload) {
                    if (screenId === 'view-chapters') {
                        document.getElementById('dynamic-subject-title').innerText = payload.title;
                        VidyaApp.renderChapters(payload.title);
                    }
                    if (screenId === 'view-classroom') {
                        document.getElementById('dynamic-chapter-title').innerText = payload.title;
                        VidyaApp.renderLectures(payload.title, 'all'); // Default load all
                    }
                }
            }
            goBack() {
                if (this.history.length <= 1) return;
                const currentScreenId = this.history.pop();
                const previousScreenId = this.history[this.history.length - 1];
                document.getElementById(currentScreenId).classList.remove('active');
                document.getElementById(previousScreenId).classList.remove('background');
                document.getElementById(previousScreenId).classList.add('active');
            }
        }

        window.router = new VidyaRouter();
        window.navigateTo = (screenId, payload) => window.router.navigate(screenId, payload);
        window.navigateBack = () => window.router.goBack();

        window.VidyaApp = {
            currentUser: null,
            currentBatchId: null,
            enrolledBatchesList: [],
            materialsTree: {}, 

            async init() {
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        this.currentUser = user;
                        await this.fetchUserBatches();
                    } else {
                        window.location.replace("login.html");
                    }
                });
            },

            async fetchUserBatches() {
                try {
                    const userRef = doc(db, "users", this.currentUser.uid);
                    const userSnap = await getDoc(userRef);

                    if (userSnap.exists()) {
                        const batchIds = userSnap.data().enrolledBatches || [];
                        if (batchIds.length > 0) {
                            this.enrolledBatchesList = batchIds;
                            this.currentBatchId = batchIds[batchIds.length - 1];
                            await this.populateBatchDropdown();
                            await this.fetchBatchData(this.currentBatchId);
                        } else {
                            document.getElementById('current-batch-name').innerText = "No Batches Found";
                        }
                    }
                } catch (error) { console.error("Error fetching user data:", error); }
            },

            async populateBatchDropdown() {
                const dropdown = document.getElementById('batch-dropdown');
                dropdown.innerHTML = '';
                
                for (let bId of this.enrolledBatchesList) {
                    const bSnap = await getDoc(doc(db, "batches", bId));
                    if (bSnap.exists()) {
                        const title = bSnap.data().title;
                        dropdown.innerHTML += `<div class="batch-option" onclick="VidyaApp.switchBatch('${bId}', '${title}')">${title}</div>`;
                    }
                }
            },

            async switchBatch(batchId, batchTitle) {
                document.getElementById('current-batch-name').innerText = "Loading...";
                this.currentBatchId = batchId;
                await this.fetchBatchData(batchId);
                document.getElementById('batch-dropdown').classList.remove('show');
            },

            async fetchBatchData(batchId) {
                try {
                    const batchSnap = await getDoc(doc(db, "batches", batchId));
                    if (batchSnap.exists()) document.getElementById('current-batch-name').innerText = batchSnap.data().title;

                    const q = query(collection(db, "batches", batchId, "materials"), where("status", "==", "Active"));
                    const matSnap = await getDocs(q);

                    this.materialsTree = {};
                    matSnap.forEach(docSnap => {
                        const data = docSnap.data();
                        data.id = docSnap.id;
                        const subject = data.subject || "General";
                        const chapter = data.chapter || "Uncategorized";
                        if (!this.materialsTree[subject]) this.materialsTree[subject] = {};
                        if (!this.materialsTree[subject][chapter]) this.materialsTree[subject][chapter] = [];
                        this.materialsTree[subject][chapter].push(data);
                    });

                    this.renderSubjects();
                } catch (error) { console.error("Error fetching materials:", error); }
            },

            /* FIX: Subject Tabs Logic */
            switchSubjectTab(type, el) {
                const tabs = el.parentElement.children;
                for(let t of tabs) { t.classList.remove('active'); }
                el.classList.add('active');

                const container = document.getElementById('subject-list-container');
                if (type === 'resources') {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open fa-3x" style="margin-bottom:15px;"></i><br>No resources available right now.</div>`;
                } else {
                    this.renderSubjects();
                }
            },

            renderSubjects() {
                const container = document.getElementById('subject-list-container');
                container.innerHTML = ''; 
                const subjects = Object.keys(this.materialsTree);
                
                if (subjects.length === 0) {
                    container.innerHTML = `<div class="empty-state">No subjects available in this batch.</div>`;
                    return;
                }

                subjects.forEach(subject => {
                    const initial = subject.substring(0, 2).charAt(0).toUpperCase() + subject.substring(1, 2).toLowerCase();
                    container.innerHTML += `
                        <div class="data-card" onclick="navigateTo('view-chapters', {title: '${subject}'})">
                            <div class="subject-icon">${initial}</div>
                            <div class="card-content">
                                <div class="card-title">${subject}</div>
                            </div>
                            <i class="fas fa-chevron-right" style="color: var(--text-tertiary);"></i>
                        </div>`;
                });
            },

            renderChapters(subjectName) {
                const container = document.getElementById('chapter-list-container');
                container.innerHTML = '';
                const chaptersObj = this.materialsTree[subjectName];
                if (!chaptersObj) return;

                let index = 1;
                for (const [chapter, lectures] of Object.entries(chaptersObj)) {
                    const videoCount = lectures.filter(l => l.videoUrl).length;
                    const pdfCount = lectures.filter(l => l.pdfUrl).length;
                    const chLabel = index < 10 ? `0${index}` : index;

                    container.innerHTML += `
                        <div class="data-card" style="align-items: flex-start;" onclick="navigateTo('view-classroom', {title: '${chapter}'})">
                            <div class="card-content">
                                <span style="font-size:0.7rem; font-weight:800; color:var(--primary-accent); background:#e0e7ff; padding:3px 8px; border-radius:6px;">CH - ${chLabel}</span>
                                <div class="card-title" style="margin-top:8px;">${chapter}</div>
                                <div class="card-subtitle">Lectures : ${videoCount} • PDFs : ${pdfCount}</div>
                            </div>
                            <i class="fas fa-chevron-right" style="color: var(--text-tertiary); align-self: center;"></i>
                        </div>`;
                    index++;
                }
            },

            /* FIX: Filter Classroom Logic (Videos vs Notes) */
            filterClassroom(filterType, el) {
                const tabs = el.parentElement.children;
                for(let t of tabs) { 
                    t.style.background = 'transparent'; 
                    t.style.color = 'var(--text-primary)'; 
                    t.style.border = '1px solid var(--border-subtle)'; 
                }
                el.style.background = 'var(--text-primary)';
                el.style.color = 'white';
                el.style.border = 'none';

                const currentChapter = document.getElementById('dynamic-chapter-title').innerText;
                this.renderLectures(currentChapter, filterType);
            },

            renderLectures(chapterName, filterType = 'all') {
                const container = document.getElementById('lecture-list-container');
                container.innerHTML = '';
                const currentSubject = document.getElementById('dynamic-subject-title').innerText;
                const allMaterials = this.materialsTree[currentSubject][chapterName];

                if (!allMaterials || allMaterials.length === 0) {
                    container.innerHTML = `<div class="empty-state">No materials uploaded yet.</div>`;
                    return;
                }

                // Filter logic
                let itemsToRender = allMaterials;
                if(filterType === 'lectures') itemsToRender = allMaterials.filter(m => m.videoUrl);
                if(filterType === 'notes') itemsToRender = allMaterials.filter(m => m.pdfUrl);

                if (itemsToRender.length === 0) {
                    container.innerHTML = `<div class="empty-state">Nothing found in this section.</div>`;
                    return;
                }

                itemsToRender.forEach(lec => {
                    const thumb = lec.thumbUrl || 'https://via.placeholder.com/150x90?text=VidyaPlus';
                    let actionButtons = '';
                    
                    // Show only relevant buttons based on current tab
                    if (lec.pdfUrl && (filterType === 'all' || filterType === 'notes')) {
                        actionButtons += `<a href="${lec.pdfUrl}" target="_blank" class="btn-outline" style="text-decoration:none;"><i class="fas fa-file-pdf" style="color:#ef4444;"></i> Read Notes</a>`;
                    }
                    if (lec.videoUrl && (filterType === 'all' || filterType === 'lectures')) {
                        actionButtons += `<button class="btn-outline" style="color:white; background:var(--brand-navy); border-color:var(--brand-navy);" onclick="window.launchCustomPlayer('${lec.videoUrl}')"><i class="fas fa-play"></i> Watch Video</button>`;
                    }

                    container.innerHTML += `
                        <div class="lecture-card">
                            <div class="lec-card-top">
                                <div class="lec-thumb">
                                    <img src="${thumb}" alt="thumbnail" onerror="this.src='https://via.placeholder.com/150x90'">
                                    ${lec.videoUrl && (filterType === 'all' || filterType === 'lectures') ? `<div class="play-overlay"><i class="fas fa-play-circle"></i></div>` : ''}
                                </div>
                                <div class="lec-info">
                                    <div class="lec-meta"><i class="fas fa-bookmark"></i> Material</div>
                                    <h4>${lec.title}</h4>
                                </div>
                            </div>
                            <div class="lec-actions">${actionButtons}</div>
                        </div>`;
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => { VidyaApp.init(); });
        window.launchCustomPlayer = (url) => { alert("Video Player API triggered for URL: " + url); };
    </script>
</body>
</html>
