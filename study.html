<head>
    <meta charset="UTF-8">

    <style>
        /* ==========================================================
           1. VIDYAPLUS ULTRA: DESIGN SYSTEM & CSS VARIABLES
           ========================================================== */
        :root {
            /* Brand Identity (Navy & Gradient) */
            --brand-navy: #0f172a;
            --brand-navy-light: #1e293b;
            --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #db2777 100%);
            --primary-accent: #6366f1;
            
            /* Backgrounds & Surfaces */
            --bg-root: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-surface-glass: rgba(255, 255, 255, 0.85);
            
            /* Typography Colors */
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            
            /* Borders & Dividers */
            --border-subtle: rgba(148, 163, 184, 0.15);
            --border-strong: rgba(148, 163, 184, 0.3);
            
            /* Elevation & Shadows (Smooth Apple-like physics) */
            --elevation-1: 0 2px 4px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.06);
            --elevation-2: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
            
            /* Animation Curves */
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ==========================================================
           2. APP SHELL RESET & FLUID TYPOGRAPHY
           ========================================================== */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            width: 100vw; height: 100vh;
            background-color: var(--bg-root);
            color: var(--text-primary);
            overflow: hidden; /* Strict Native App Constraint */
            overscroll-behavior-y: none; /* Disables browser pull-to-refresh */
            display: flex; justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px; /* Mobile App Aspect Ratio limit for Desktop view */
            height: 100%;
            background: var(--bg-surface);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        /* Modern Scrollbar Engine */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-tertiary); border-radius: 10px; }

        /* ==========================================================
           3. ADVANCED SPA ROUTING & HARDWARE ACCELERATION
           ========================================================== */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-root);
            display: flex; flex-direction: column;
            will-change: transform, opacity; /* GPU Hinting */
            /* Using translate3d for hardware acceleration */
            transform: translate3d(100%, 0, 0); 
            transition: transform 0.4s var(--ease-out-expo), opacity 0.4s var(--ease-out-expo);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }

        .screen.active {
            transform: translate3d(0, 0, 0);
            z-index: 20;
            opacity: 1;
            pointer-events: all;
        }

        /* Parallax depth effect for background screens */
        .screen.background {
            transform: translate3d(-20%, 0, 0);
            opacity: 0.5;
            z-index: 10;
        }

        .screen-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom, 20px);
            scroll-behavior: smooth;
        }

        /* ==========================================================
           4. GLOBAL PREMIUM UI COMPONENTS
           ========================================================== */
        
        /* Glassmorphic Header */
        .premium-header {
            background: var(--bg-surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1rem 1.25rem;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            position: sticky; top: 0; z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        
        .btn-icon {
            width: 38px; height: 38px;
            border-radius: 50%; border: none;
            background: transparent; color: var(--text-primary);
            font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s ease;
        }
        .btn-icon:active { background: var(--border-subtle); transform: scale(0.95); }

        .header-title {
            font-size: clamp(1rem, 4vw, 1.15rem);
            font-weight: 700; color: var(--brand-navy);
            letter-spacing: -0.3px;
        }

        /* Shimmer Loading Skeleton (Professional state management) */
        .skeleton {
            background: #e2e8f0;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
            border-radius: 8px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    </style>
</head>

        <script type="module">
        import { db, auth } from './firebase-init.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        /* --- THE SPA ROUTER (Hardware Accelerated) --- */
        class VidyaRouter {
            constructor() {
                this.history = ['view-dashboard']; // Tracking screen navigation
            }

            navigate(screenId, payload = null) {
                const currentScreen = document.getElementById(this.history[this.history.length - 1]);
                const nextScreen = document.getElementById(screenId);
                
                if (!nextScreen) return;

                // Push to history
                this.history.push(screenId);

                // Slide current screen slightly back (Depth effect)
                currentScreen.classList.remove('active');
                currentScreen.classList.add('background');

                // Bring next screen forward
                nextScreen.classList.remove('background');
                nextScreen.classList.add('active');

                // Process Payload (Dynamic Titles)
                if (payload) {
                    if (screenId === 'view-chapters') {
                        document.getElementById('dynamic-subject-title').innerText = payload.title;
                        VidyaApp.renderChapters(payload.title); // Trigger UI update
                    }
                    if (screenId === 'view-classroom') {
                        document.getElementById('dynamic-chapter-title').innerText = payload.title;
                        VidyaApp.renderLectures(payload.title); // Trigger UI update
                    }
                }
            }

            goBack() {
                if (this.history.length <= 1) return;

                const currentScreenId = this.history.pop();
                const previousScreenId = this.history[this.history.length - 1];

                const currentScreen = document.getElementById(currentScreenId);
                const previousScreen = document.getElementById(previousScreenId);

                // Slide current screen out to right
                currentScreen.classList.remove('active');

                // Bring previous screen back to center
                previousScreen.classList.remove('background');
                previousScreen.classList.add('active');
            }
        }

        /* Global Hooks for HTML inline onclick */
        window.router = new VidyaRouter();
        window.navigateTo = (screenId, payload) => window.router.navigate(screenId, payload);
        window.navigateBack = () => window.router.goBack();


        /* --- THE STATE MANAGER (Data Engine) --- */
        const VidyaApp = {
            currentUser: null,
            enrolledBatchesData: [], 
            currentBatchId: null,
            materialsTree: {}, // The ultimate fast-access tree: { 'Physics': { 'Ch-1': [lectures], 'Ch-2': [] } }

            async init() {
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        this.currentUser = user;
                        // Set Avatar
                        const initials = user.email.charAt(0).toUpperCase();
                        document.querySelectorAll('#userIcon').forEach(el => el.innerText = initials);
                        
                        await this.fetchUserBatches();
                    } else {
                        window.location.replace("login.html");
                    }
                });
            },

            async fetchUserBatches() {
                try {
                    const userRef = doc(db, "users", this.currentUser.uid);
                    const userSnap = await getDoc(userRef);

                    if (userSnap.exists()) {
                        const batchIds = userSnap.data().enrolledBatches || [];
                        if (batchIds.length > 0) {
                            // Automatically select the most recently enrolled batch (Last item in array)
                            this.currentBatchId = batchIds[batchIds.length - 1];
                            await this.fetchBatchData(this.currentBatchId);
                        } else {
                            // No batches
                            document.getElementById('current-batch-name').innerText = "No Batches Found";
                            alert("Bhai, pehle Explore Batches se koi batch kharid lo!");
                            window.location.replace('explore.html');
                        }
                    }
                } catch (error) {
                    console.error("Error fetching user data:", error);
                }
            },

            async fetchBatchData(batchId) {
                try {
                    // Fetch Batch Name
                    const batchSnap = await getDoc(doc(db, "batches", batchId));
                    if (batchSnap.exists()) {
                        document.getElementById('current-batch-name').innerText = batchSnap.data().title;
                    }

                    // Fetch All Materials for this batch (One big query, massive speed boost)
                    const matRef = collection(db, "batches", batchId, "materials");
                    const q = query(matRef, where("status", "==", "Active"));
                    const matSnap = await getDocs(q);

                    this.materialsTree = {};

                    matSnap.forEach(docSnap => {
                        const data = docSnap.data();
                        data.id = docSnap.id;
                        
                        const subject = data.subject || "General";
                        const chapter = data.chapter || "Uncategorized";

                        // Build the deeply nested tree
                        if (!this.materialsTree[subject]) this.materialsTree[subject] = {};
                        if (!this.materialsTree[subject][chapter]) this.materialsTree[subject][chapter] = [];
                        
                        this.materialsTree[subject][chapter].push(data);
                    });

                    console.log("God-Mode Tree Built:", this.materialsTree);
                    this.renderSubjects();

                } catch (error) {
                    console.error("Error fetching materials:", error);
                }
            },

            // Renders Screen 2 (Subjects)
            renderSubjects() {
                const container = document.getElementById('subject-list-container');
                container.innerHTML = ''; // Clear skeleton

                const subjects = Object.keys(this.materialsTree);
                if (subjects.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-tertiary);">No subjects available.</div>`;
                    return;
                }

                subjects.forEach(subject => {
                    const initial = subject.substring(0, 2).charAt(0).toUpperCase() + subject.substring(1, 2).toLowerCase();
                    // Fake progress for visual appeal, can be mapped to real DB later
                    const fakeProgress = Math.floor(Math.random() * 20); 

                    container.innerHTML += `
                        <div class="data-card" onclick="navigateTo('view-chapters', {title: '${subject}'})">
                            <div class="subject-icon">${initial}</div>
                            <div class="card-content">
                                <div class="card-title">${subject}</div>
                            </div>
                            <div class="mini-progress">
                                <span>${fakeProgress}%</span>
                                <div class="mini-progress-bar"><div class="mini-progress-fill" style="width: ${fakeProgress}%;"></div></div>
                            </div>
                            <i class="fas fa-chevron-right" style="color: var(--text-tertiary); margin-left: 5px;"></i>
                        </div>
                    `;
                });
            },

            // Renders Screen 3 (Chapters)
            renderChapters(subjectName) {
                const container = document.getElementById('chapter-list-container');
                container.innerHTML = '';
                
                const chaptersObj = this.materialsTree[subjectName];
                if (!chaptersObj) return;

                let index = 1;
                for (const [chapter, lectures] of Object.entries(chaptersObj)) {
                    // Extracting only PDFs vs Videos
                    const videoCount = lectures.filter(l => l.videoUrl).length;
                    const pdfCount = lectures.filter(l => l.pdfUrl).length;
                    const chLabel = index < 10 ? `0${index}` : index;

                    container.innerHTML += `
                        <div class="data-card" style="align-items: flex-start;" onclick="navigateTo('view-classroom', {title: '${chapter}', subject: '${subjectName}'})">
                            <div class="card-content">
                                <span style="font-size:0.7rem; font-weight:800; color:var(--primary-accent); background:#e0e7ff; padding:3px 8px; border-radius:6px;">CH - ${chLabel}</span>
                                <div class="card-title" style="margin-top:8px;">${chapter}</div>
                                <div class="card-subtitle">Lectures : ${videoCount} • PDFs : ${pdfCount}</div>
                            </div>
                            <i class="fas fa-chevron-right" style="color: var(--text-tertiary); align-self: center;"></i>
                        </div>
                    `;
                    index++;
                }
            },

            // Renders Screen 4 (Lectures list inside classroom view)
            renderLectures(chapterName) {
                const container = document.getElementById('lecture-list-container');
                container.innerHTML = '';

                // We need to find which subject this chapter belongs to by checking current DOM title or state
                const currentSubject = document.getElementById('dynamic-subject-title').innerText;
                const lectures = this.materialsTree[currentSubject][chapterName];

                if (!lectures || lectures.length === 0) {
                    container.innerHTML = `<div style="padding:2rem; text-align:center; color:var(--text-tertiary);">No lectures uploaded yet.</div>`;
                    return;
                }

                lectures.forEach(lec => {
                    const thumb = lec.thumbUrl || 'https://via.placeholder.com/150x90?text=VidyaPlus';
                    let actionButtons = '';
                    
                    if (lec.pdfUrl) {
                        actionButtons += `<a href="${lec.pdfUrl}" target="_blank" class="btn-outline" style="text-decoration:none;"><i class="fas fa-file-pdf" style="color:#ef4444;"></i> Notes</a>`;
                    }
                    if (lec.videoUrl) {
                        actionButtons += `<button class="btn-outline" style="color:var(--bg-surface); background:var(--brand-navy); border-color:var(--brand-navy);" onclick="window.launchCustomPlayer('${lec.videoUrl}')"><i class="fas fa-play"></i> Watch</button>`;
                    }

                    container.innerHTML += `
                        <div class="lecture-card">
                            <div class="lec-card-top">
                                <div class="lec-thumb">
                                    <img src="${thumb}" alt="thumbnail" onerror="this.src='https://via.placeholder.com/150x90'">
                                    ${lec.videoUrl ? `<div class="play-overlay"><i class="fas fa-play-circle"></i></div>` : ''}
                                </div>
                                <div class="lec-info">
                                    <div class="lec-meta"><i class="fas fa-video"></i> Master Class</div>
                                    <h4>${lec.title}</h4>
                                </div>
                            </div>
                            <div class="lec-actions">
                                ${actionButtons}
                            </div>
                        </div>
                    `;
                });
            }
        };

        // Initialize Engine
        document.addEventListener('DOMContentLoaded', () => {
            VidyaApp.init();
        });

        /* --- THE CUSTOM PLAYER ENGINE (Foundation) --- */
        window.launchCustomPlayer = (url) => {
            alert("Bhai! Custom player screen aayegi ab idhar! URL: " + url + "\n\nIske liye ek overlay Modal banayenge next step me!");
            // Implementation mapping for future:
            // 1. Open a full-screen overlay over Screen 4.
            // 2. If YT: Append ?controls=0&modestbranding=1
            // 3. Render our custom HTML controls below it.
        };

                    </script>
</body>
