<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VidyaPlus Study Zone</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 1. SIMPLE VARIABLES */
        :root {
            --primary: #4F46E5;
            --navy: #0B1120;
            --bg-color: #F1F5F9;
            --surface: #FFFFFF;
            --text-main: #0F172A;
            --text-light: #64748B;
            --border: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg-color); color: var(--text-main); }

        /* 2. MAIN APP CONTAINER */
        .app-container {
            max-width: 800px; /* Tablet/Desktop friendly */
            margin: 0 auto;
            background: var(--surface);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
        }

        /* 3. SIMPLE SCREENS (No complex slide animations that cause bugs) */
        .screen { display: none; flex-direction: column; min-height: 100vh; }
        .screen.active { display: flex; }

        .screen-content { flex: 1; overflow-y: auto; padding-bottom: 30px; }

        /* 4. HEADER & BATCH DROPDOWN (Z-Index Fixed) */
        .header-dark {
            background: var(--navy); color: white;
            padding: 1.5rem; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            position: relative; z-index: 100; /* Highest priority */
        }
        
        .top-nav { display: flex; justify-content: space-between; font-size: 1.3rem; margin-bottom: 20px; }
        .top-nav i { cursor: pointer; }

        /* Dropdown - Plain and Simple */
        .batch-selector {
            display: inline-flex; align-items: center; gap: 8px; font-size: 1.2rem; font-weight: 700;
            cursor: pointer; position: relative; padding: 5px 0;
        }
        .dropdown-menu {
            display: none; position: absolute; top: 100%; left: 0;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; width: 250px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1000; overflow: hidden;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            padding: 12px 15px; color: var(--text-main); font-size: 0.95rem; font-weight: 600;
            border-bottom: 1px solid var(--border); cursor: pointer;
        }
        .dropdown-item:hover { background: var(--bg-color); color: var(--primary); }

        /* 5. APP GRID (No negative margins!) */
        .app-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            padding: 20px; background: var(--surface);
        }
        .grid-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .grid-icon {
            width: 60px; height: 60px; background: var(--bg-color); color: var(--primary);
            border-radius: 16px; display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; border: 1px solid var(--border); transition: 0.2s;
        }
        .grid-item:active .grid-icon { transform: scale(0.95); background: #E0E7FF; }
        .grid-text { font-size: 0.75rem; font-weight: 700; text-align: center; }

        /* 6. COMMON LIST CARDS (Subjects, Chapters, Lectures) */
        .page-header {
            display: flex; align-items: center; gap: 15px; padding: 15px 20px;
            background: var(--surface); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 50;
        }
        .back-btn { font-size: 1.2rem; cursor: pointer; border: none; background: transparent; color: var(--text-main); }
        .page-title { font-size: 1.1rem; font-weight: 700; }

        .list-container { padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; }
        
        .list-card {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); cursor: pointer;
        }
        .list-card:active { background: var(--bg-color); }
        .card-icon { width: 45px; height: 45px; background: #E0E7FF; color: var(--primary); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 1.2rem; flex-shrink: 0; }
        .card-info { flex: 1; overflow: hidden; }
        .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sub { font-size: 0.8rem; color: var(--text-light); font-weight: 500; }

        /* Lecture Card Specific */
        .lecture-card { border: 1px solid var(--border); border-radius: 12px; padding: 15px; background: var(--surface); margin-bottom: 15px;}
        .lec-top { display: flex; gap: 12px; margin-bottom: 15px; }
        .lec-thumb { width: 120px; height: 70px; border-radius: 8px; background: var(--bg-color); object-fit: cover; flex-shrink: 0; }
        .lec-actions { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; border: 1px solid var(--border); background: transparent; }
        .action-btn.play { background: var(--navy); color: white; border-color: var(--navy); }

        /* Tabs */
        .tabs { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; border-bottom: 1px solid var(--border); }
        .tab-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; font-weight: 600; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--navy); color: white; border-color: var(--navy); }

        /* Empty State */
        .empty-box { text-align: center; padding: 40px 20px; color: var(--text-light); }
        .empty-box i { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.5; }
        .empty-box h4 { font-size: 1rem; font-weight: 600; }

        /* Overlays & Modals (Simple implementation) */
        .simple-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 9000; }
        .simple-modal { display: none; position: fixed; top: 0; width: 280px; height: 100vh; background: var(--surface); z-index: 9999; flex-direction: column; }
        #menu-modal { left: 0; }
        #notif-modal { right: 0; width: 320px; }
    </style>
</head>
<body>
    <div class="simple-overlay" id="global-overlay" onclick="closeModals()"></div>

    <div class="simple-modal" id="menu-modal">
        <div style="padding: 30px 20px; background: var(--navy); color: white;">
            <div style="width: 60px; height: 60px; background: white; color: var(--navy); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: 800; margin-bottom: 10px;" id="userIcon">U</div>
            <h3 id="userName">Student</h3>
            <p style="font-size: 0.8rem; opacity: 0.7;">VidyaPlus Premium</p>
        </div>
        <div style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
            <div style="font-weight: 600; cursor: pointer;"><i class="fas fa-user-circle" style="width: 25px;"></i> Profile</div>
            <div style="font-weight: 600; cursor: pointer;"><i class="fas fa-cog" style="width: 25px;"></i> Settings</div>
            <div style="font-weight: 600; color: #EF4444; cursor: pointer; margin-top: 20px;"><i class="fas fa-sign-out-alt" style="width: 25px;"></i> Logout</div>
        </div>
    </div>

    <div class="simple-modal" id="notif-modal">
        <div style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
            <h3 style="color: var(--navy);">Notifications</h3>
            <i class="fas fa-times" style="cursor: pointer; font-size: 1.2rem;" onclick="closeModals()"></i>
        </div>
        <div style="padding: 20px;" id="notif-container">
            <div class="empty-box"><i class="far fa-bell-slash"></i><h4>No new notifications</h4></div>
        </div>
    </div>

    <div class="app-container">
        
        <div id="boot-screen" style="position: absolute; inset: 0; background: var(--surface); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <i class="fas fa-bolt fa-4x" style="color: var(--primary); margin-bottom: 20px;"></i>
            <h2 style="color: var(--navy);">VidyaPlus</h2>
        </div>

        <div class="screen active" id="dashboard">
            <div class="header-dark">
                <div class="top-nav">
                    <i class="fas fa-bars" onclick="openMenu()"></i>
                    <i class="fas fa-bell" onclick="openNotif()"></i>
                </div>
                <div style="font-size: 0.8rem; font-weight: 600; opacity: 0.8; margin-bottom: 5px;">CURRENT BATCH</div>
                
                <div style="position: relative;">
                    <div class="batch-selector" onclick="toggleDropdown(event)">
                        <span id="current-batch-name">Loading...</span>
                        <i class="fas fa-chevron-down" style="font-size: 1rem;"></i>
                    </div>
                    <div class="dropdown-menu" id="batch-dropdown">
                        <div class="dropdown-item">Loading...</div>
                    </div>
                </div>
            </div>

            <div class="screen-content">
                <div class="app-grid">
                    <div class="grid-item" onclick="navigate('subjects')">
                        <div class="grid-icon"><i class="fas fa-play-circle"></i></div>
                        <span class="grid-text">All Classes</span>
                    </div>
                    <div class="grid-item" onclick="alert('Tests coming soon!')">
                        <div class="grid-icon"><i class="fas fa-file-alt"></i></div>
                        <span class="grid-text">All Tests</span>
                    </div>
                    <div class="grid-item" onclick="alert('Doubts coming soon!')">
                        <div class="grid-icon"><i class="fas fa-question-circle"></i></div>
                        <span class="grid-text">My Doubts</span>
                    </div>
                    <div class="grid-item" onclick="alert('Community coming soon!')">
                        <div class="grid-icon"><i class="fas fa-users"></i></div>
                        <span class="grid-text">Community</span>
                    </div>
                </div>

                <div style="padding: 20px;">
                    <h3 style="font-size: 1.1rem; color: var(--navy); margin-bottom: 15px;">Live Classes</h3>
                    <div id="live-container" style="display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px;">
                        <div class="empty-box" style="width: 100%; border: 1px dashed var(--border); border-radius: 12px;"><i class="fas fa-satellite-dish"></i><h4>No live classes</h4></div>
                    </div>

                    <h3 style="font-size: 1.1rem; color: var(--navy); margin: 25px 0 15px;">Announcements</h3>
                    <div id="announcement-container" style="display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px;">
                        <div class="empty-box" style="width: 100%; border: 1px dashed var(--border); border-radius: 12px;"><i class="fas fa-bullhorn"></i><h4>No new announcements</h4></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="screen" id="subjects">
            <div class="page-header">
                <button class="back-btn" onclick="navigate('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <div class="page-title">All Classes</div>
            </div>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(this, 'subject-list')">Subjects</button>
                <button class="tab-btn" onclick="switchTab(this, 'resource-list')">Resources</button>
            </div>
            <div class="screen-content list-container" id="subject-list">
                </div>
        </div>

        <div class="screen" id="chapters">
            <div class="page-header">
                <button class="back-btn" onclick="navigate('subjects')"><i class="fas fa-arrow-left"></i></button>
                <div class="page-title" id="dyn-subject-title">Subject</div>
            </div>
            <div class="tabs">
                <button class="tab-btn active">Chapters</button>
                <button class="tab-btn">Material</button>
            </div>
            <div class="screen-content list-container" id="chapter-list">
                </div>
        </div>

        <div class="screen" id="classroom">
            <div class="page-header">
                <button class="back-btn" onclick="navigate('chapters')"><i class="fas fa-arrow-left"></i></button>
                <div class="page-title" id="dyn-chapter-title">Chapter</div>
            </div>
            <div class="tabs">
                <button class="tab-btn active" onclick="filterClassroom('all', this)">All</button>
                <button class="tab-btn" onclick="filterClassroom('lectures', this)">Lectures</button>
                <button class="tab-btn" onclick="filterClassroom('notes', this)">Notes</button>
            </div>
            <div class="screen-content list-container" id="lecture-list">
                </div>
        </div>

    </div>
        <script type="module">
        import { db, auth } from './firebase-init.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- GLOBAL STATE ---
        window.currentSubject = null;
        window.currentChapter = null;
        window.materialsTree = {}; 

        // ==========================================
        // 1. SIMPLE MODALS & DROPDOWNS
        // ==========================================
        window.openMenu = () => {
            document.getElementById('global-overlay').style.display = 'block';
            document.getElementById('menu-modal').style.display = 'flex';
        };

        window.openNotif = () => {
            document.getElementById('global-overlay').style.display = 'block';
            document.getElementById('notif-modal').style.display = 'flex';
        };

        window.closeModals = () => {
            document.getElementById('global-overlay').style.display = 'none';
            document.getElementById('menu-modal').style.display = 'none';
            document.getElementById('notif-modal').style.display = 'none';
            document.getElementById('batch-dropdown').classList.remove('show');
        };

        window.toggleDropdown = (e) => {
            e.stopPropagation();
            document.getElementById('batch-dropdown').classList.toggle('show');
        };

        // Click outside dropdown to close
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('batch-dropdown');
            if (dropdown && dropdown.classList.contains('show') && !e.target.closest('.batch-selector')) {
                dropdown.classList.remove('show');
            }
        });

        // ==========================================
        // 2. FOOLPROOF NAVIGATION (NO URL HASH BUGS)
        // ==========================================
        window.navigate = (screenId, payload = {}) => {
            // Close any open menus first
            closeModals();

            // Hide all screens
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            
            // Show the requested screen
            const target = document.getElementById(screenId);
            if (target) target.classList.add('active');

            // Handle data passing (Payloads)
            if (payload.subject) window.currentSubject = payload.subject;
            if (payload.chapter) window.currentChapter = payload.chapter;

            // Trigger data rendering
            if (screenId === 'subjects') renderSubjects();
            if (screenId === 'chapters') renderChapters(window.currentSubject);
            if (screenId === 'classroom') filterClassroom('all');
        };

        // ==========================================
        // 3. FIREBASE AUTH & SECURITY BOUNCER
        // ==========================================
        const initApp = () => {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    // Set User UI
                    const name = user.displayName || user.email.split('@')[0];
                    document.getElementById('userName').innerText = name;
                    document.getElementById('userIcon').innerText = name.charAt(0).toUpperCase();
                    
                    await fetchUserBatches(user.uid);
                } else {
                    window.location.replace("login.html");
                }
            });
        };

        const fetchUserBatches = async (uid) => {
            try {
                const userSnap = await getDoc(doc(db, "users", uid));
                if (userSnap.exists()) {
                    const batchIds = userSnap.data().enrolledBatches || [];
                    
                    // 🛡️ SECURITY BOUNCER: Block users without batches
                    if (batchIds.length === 0) {
                        alert("Access Denied: Please enroll in a batch first!");
                        window.location.replace('explore.html');
                        return;
                    }

                    // Populate Dropdown
                    const dropdown = document.getElementById('batch-dropdown');
                    dropdown.innerHTML = '';
                    for (let bId of batchIds) {
                        const bSnap = await getDoc(doc(db, "batches", bId));
                        if (bSnap.exists()) {
                            const title = bSnap.data().title;
                            dropdown.innerHTML += `<div class="dropdown-item" onclick="switchBatch('${bId}')">${title}</div>`;
                        }
                    }

                    // Load Latest Batch
                    await switchBatch(batchIds[batchIds.length - 1]);
                } else {
                    window.location.replace("login.html");
                }
            } catch (error) {
                console.error("Auth Error:", error);
                window.location.replace("login.html");
            }
        };

        window.switchBatch = async (batchId) => {
            document.getElementById('current-batch-name').innerText = "Loading...";
            closeModals();
            window.navigate('dashboard'); // Return to main screen safely

            try {
                // Get Batch Title
                const batchSnap = await getDoc(doc(db, "batches", batchId));
                if (batchSnap.exists()) {
                    document.getElementById('current-batch-name').innerText = batchSnap.data().title;
                }

                // Fetch Materials
                const matRef = collection(db, "batches", batchId, "materials");
                const q = query(matRef, where("status", "==", "Active"));
                const matSnap = await getDocs(q);

                window.materialsTree = {};
                matSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    const subject = data.subject || "General";
                    const chapter = data.chapter || "Uncategorized";
                    
                    if (!window.materialsTree[subject]) window.materialsTree[subject] = {};
                    if (!window.materialsTree[subject][chapter]) window.materialsTree[subject][chapter] = [];
                    
                    window.materialsTree[subject][chapter].push(data);
                });

                // Remove Boot Screen
                const boot = document.getElementById('boot-screen');
                if (boot) {
                    boot.style.opacity = '0';
                    setTimeout(() => boot.style.display = 'none', 300);
                }
            } catch (error) {
                console.error("Data Load Error:", error);
                alert("Error loading batch data!");
            }
        };

        // ==========================================
        // 4. DATA RENDERERS (DOM INJECTION)
        // ==========================================
        window.switchTab = (btnElement, listId) => {
            const tabs = btnElement.parentElement.children;
            for(let t of tabs) { t.classList.remove('active'); }
            btnElement.classList.add('active');

            if (listId === 'resource-list') {
                document.getElementById('subject-list').innerHTML = `<div class="empty-box"><i class="fas fa-folder-open"></i><h4>No resources yet</h4></div>`;
            } else {
                renderSubjects();
            }
        };

        const renderSubjects = () => {
            const container = document.getElementById('subject-list');
            container.innerHTML = ''; 
            const subjects = Object.keys(window.materialsTree);
            
            if (subjects.length === 0) {
                container.innerHTML = `<div class="empty-box"><i class="fas fa-book"></i><h4>No subjects found</h4></div>`;
                return;
            }

            subjects.forEach(subject => {
                container.innerHTML += `
                    <div class="list-card" onclick="navigate('chapters', {subject: '${subject}'})">
                        <div class="card-icon">${subject.substring(0, 2).toUpperCase()}</div>
                        <div class="card-info">
                            <div class="card-title">${subject}</div>
                            <div class="card-sub">Explore chapters</div>
                        </div>
                        <i class="fas fa-chevron-right" style="color: var(--text-light);"></i>
                    </div>`;
            });
        };

        const renderChapters = (subjectName) => {
            document.getElementById('dyn-subject-title').innerText = subjectName;
            const container = document.getElementById('chapter-list');
            container.innerHTML = '';
            
            const chaptersObj = window.materialsTree[subjectName];
            if (!chaptersObj) {
                container.innerHTML = `<div class="empty-box"><i class="fas fa-layer-group"></i><h4>No chapters yet</h4></div>`;
                return;
            }

            let index = 1;
            for (const [chapter, materials] of Object.entries(chaptersObj)) {
                const vidCount = materials.filter(m => m.videoUrl).length;
                const pdfCount = materials.filter(m => m.pdfUrl).length;

                container.innerHTML += `
                    <div class="list-card" onclick="navigate('classroom', {chapter: '${chapter}'})">
                        <div class="card-info">
                            <span style="font-size:0.75rem; font-weight:800; color:var(--primary); background:#E0E7FF; padding:4px 8px; border-radius:6px;">CH-${index < 10 ? '0'+index : index}</span>
                            <div class="card-title" style="margin-top: 8px;">${chapter}</div>
                            <div class="card-sub">Videos: ${vidCount} • Notes: ${pdfCount}</div>
                        </div>
                        <i class="fas fa-chevron-right" style="color: var(--text-light);"></i>
                    </div>`;
                index++;
            }
        };

        window.filterClassroom = (filterType, btnElement = null) => {
            if(btnElement) {
                const tabs = btnElement.parentElement.children;
                for(let t of tabs) { t.classList.remove('active'); }
                btnElement.classList.add('active');
            }
            
            document.getElementById('dyn-chapter-title').innerText = window.currentChapter;
            const container = document.getElementById('lecture-list');
            container.innerHTML = '';
            
            const allMaterials = window.materialsTree[window.currentSubject][window.currentChapter];

            if (!allMaterials || allMaterials.length === 0) {
                container.innerHTML = `<div class="empty-box"><i class="fas fa-box-open"></i><h4>Nothing uploaded yet</h4></div>`;
                return;
            }

            let items = allMaterials;
            if(filterType === 'lectures') items = allMaterials.filter(m => m.videoUrl);
            if(filterType === 'notes') items = allMaterials.filter(m => m.pdfUrl);

            if (items.length === 0) {
                container.innerHTML = `<div class="empty-box"><i class="fas fa-search"></i><h4>No ${filterType} found</h4></div>`;
                return;
            }

            items.forEach(mat => {
                let btns = '';
                if (mat.pdfUrl && (filterType === 'all' || filterType === 'notes')) {
                    btns += `<a href="${mat.pdfUrl}" target="_blank" class="action-btn" style="text-decoration:none; color:inherit;"><i class="fas fa-file-pdf" style="color: #EF4444;"></i> Read Notes</a>`;
                }
                if (mat.videoUrl && (filterType === 'all' || filterType === 'lectures')) {
                    btns += `<button class="action-btn play" onclick="alert('Video Player API triggered!')"><i class="fas fa-play"></i> Watch</button>`;
                }

                container.innerHTML += `
                    <div class="lecture-card">
                        <div class="lec-top">
                            <div class="card-info">
                                <div class="card-title" style="white-space: normal;">${mat.title}</div>
                                <div class="card-sub" style="margin-top: 5px;"><i class="fas fa-bookmark"></i> Study Material</div>
                            </div>
                        </div>
                        <div class="lec-actions">${btns}</div>
                    </div>`;
            });
        };

        // Start App Immediately
        initApp();

    </script>
</body>
</html>
