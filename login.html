<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | VidyaPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .auth-container { background: white; padding: 2.5rem 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: 0.5rem; }
        .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }
        
        .input-group { margin-bottom: 1.2rem; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 0.8rem 1rem; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 1rem; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary); outline: none; }
        
        .btn-submit { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #1d4ed8; }
        
        .toggle-text { margin-top: 1.5rem; font-size: 0.9rem; color: #64748b; }
        .toggle-text span { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: underline; }
        
        #error-message { color: #ef4444; font-size: 0.9rem; font-weight: 500; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">VidyaPlus</div>
        <div class="subtitle" id="form-subtitle">Create a new account to get started.</div>

        <form id="auth-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="student@example.com" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Sign Up</button>
            <div id="error-message"></div>
        </form>

        <div class="toggle-text" id="toggle-form">
            Already have an account? <span id="toggle-btn">Log In</span>
        </div>
    </div>

            <script type="module" src="js/login.js"></script>
</body>
</html>
