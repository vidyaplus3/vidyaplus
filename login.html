<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | VidyaPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .auth-container { background: white; padding: 2.5rem 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: 0.5rem; }
        .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }
        
        .input-group { margin-bottom: 1.2rem; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 0.8rem 1rem; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 1rem; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary); outline: none; }
        
        .btn-submit { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #1d4ed8; }
        
        .toggle-text { margin-top: 1.5rem; font-size: 0.9rem; color: #64748b; }
        .toggle-text span { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: underline; }
        
        #error-message { color: #ef4444; font-size: 0.9rem; font-weight: 500; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">VidyaPlus</div>
        <div class="subtitle" id="form-subtitle">Create a new account to get started.</div>

        <form id="auth-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="student@example.com" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Sign Up</button>
            <div id="error-message"></div>
        </form>

        <div class="toggle-text" id="toggle-form">
            Already have an account? <span id="toggle-btn">Log In</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6s4SQloHdaPU8EVvkrrYpYvUdahsOtI4",
            authDomain: "vidyaplus-d9c3b.firebaseapp.com",
            projectId: "vidyaplus-d9c3b",
            storageBucket: "vidyaplus-d9c3b.firebasestorage.app",
            messagingSenderId: "492916889178",
            appId: "1:492916889178:web:a3d3f3737b1236167caa63",
            measurementId: "G-Q9XL40BW87"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isLoginMode = false; 
        const toggleBtn = document.getElementById('toggle-btn');
        const formSubtitle = document.getElementById('form-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleFormText = document.getElementById('toggle-form');
        const authForm = document.getElementById('auth-form');
        const errorMsg = document.getElementById('error-message');
        // Professional Error Message Function
        function getFriendlyError(errorCode) {
            switch(errorCode) {
                case 'auth/invalid-credential':
                    return "Invalid email or password. Please try again.";
                case 'auth/email-already-in-use':
                    return "This email is already registered. Please log in.";
                case 'auth/weak-password':
                    return "Password must be at least 6 characters long.";
                case 'auth/invalid-email':
                    return "Please enter a valid email address.";
                case 'auth/network-request-failed':
                    return "Network error. Please check your internet connection.";
                default:
                    return "An unexpected error occurred. Please try again later.";
            }
        }
        
        function setupToggle() {
            document.getElementById('toggle-btn').addEventListener('click', () => {
                isLoginMode = !isLoginMode;
                errorMsg.style.display = "none"; // Switch karte waqt error chupa do
                if(isLoginMode) {
                    document.title = "Log In | VidyaPlus";
                    formSubtitle.innerText = "Welcome back! Please log in.";
                    submitBtn.innerText = "Log In";
                    toggleFormText.innerHTML = `Don't have an account? <span id="toggle-btn" style="color:#2563eb;font-weight:600;cursor:pointer;text-decoration:underline;">Sign Up</span>`;
                } else {
                    document.title = "Sign Up | VidyaPlus";
                    formSubtitle.innerText = "Create a new account to get started.";
                    submitBtn.innerText = "Sign Up";
                    toggleFormText.innerHTML = `Already have an account? <span id="toggle-btn" style="color:#2563eb;font-weight:600;cursor:pointer;text-decoration:underline;">Log In</span>`;
                }
                setupToggle(); 
            });
        }
        setupToggle();

        authForm.addEventListener('submit', (e) => {
            e.preventDefault(); 
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = "Processing...";
            errorMsg.style.display = "none";

            if(isLoginMode) {
                signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("Login Successful! Dashboard coming soon 🚀");
                    window.location.href = "index.html"; 
                })
                .catch((error) => {
                    submitBtn.innerText = originalBtnText;
                    errorMsg.innerText = getFriendlyError(error.code); // Yahan user-friendly error aayega
                    errorMsg.style.display = "block";
                });
            } else {
                createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("Account Successfully Created! Dashboard coming soon 🚀");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    submitBtn.innerText = originalBtnText;
                    errorMsg.innerText = getFriendlyError(error.code); // Yahan user-friendly error aayega
                    errorMsg.style.display = "block";
                });
            }
        });
    </script>
</body>
</html>
