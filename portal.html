<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assessment Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1d4ed8; --navy: #0f172a; --bg: #ffffff;
            --ans: #16a34a; --review: #9333ea; --not-visited: #f1f5f9; --not-ans: #dc2626;
            --border: #cbd5e1; --text: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: var(--text); font-size: 14px; }

        /* HEADER - SLEEK & MINIMAL */
        header { background: #ffffff; padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .test-title { font-weight: 700; font-size: 1.05rem; color: var(--navy); }
        
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .timer-box { font-weight: 600; font-size: 0.95rem; color: var(--navy); display: flex; align-items: center; gap: 6px; }
        .top-submit-btn { background: var(--navy); color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .top-submit-btn:hover { background: #1e293b; }

        /* MAIN LAYOUT */
        .portal-body { flex: 1; display: flex; overflow: hidden; }
        
        /* LEFT: QUESTION PANEL */
        .q-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .q-header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; background: #f8fafc; font-weight: 600; }
        .q-content { flex: 1; overflow-y: auto; padding: 25px 20px; }
        .q-text { font-size: 1.05rem; font-weight: 500; color: #000; line-height: 1.6; margin-bottom: 25px; }
        
        /* OPTIONS */
        .option-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 10px; cursor: pointer; }
        .option-row:hover { background: #f8fafc; }
        .option-row.selected { border-color: var(--primary); background: #eff6ff; }
        .opt-radio { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); display: inline-block; flex-shrink: 0; margin-top: 2px; }
        .selected .opt-radio { background: var(--primary); border-color: var(--primary); box-shadow: inset 0 0 0 3px #eff6ff; }
        
        .num-input { padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; width: 250px; outline: none; }
        .num-input:focus { border-color: var(--primary); }

        /* FOOTER ACTIONS */
        .q-footer { padding: 12px 20px; border-top: 1px solid var(--border); background: #f8fafc; display: flex; justify-content: space-between; }
        .btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 4px; font-weight: 600; cursor: pointer; background: white; font-size: 0.85rem; color: var(--text); }
        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }

        /* RIGHT: PALETTE PANEL */
        .p-panel { width: 280px; display: flex; flex-direction: column; background: white; }
        .p-info { padding: 15px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.75rem; font-weight: 600; }
        .badge { width: 12px; height: 12px; display: inline-block; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
        
        .p-grid { padding: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; overflow-y: auto; flex: 1; align-content: start; }
        .p-btn { aspect-ratio: 1; border: 1px solid var(--border); background: white; font-weight: 600; font-size: 0.85rem; cursor: pointer; border-radius: 4px; }
        .p-btn.visited { background: var(--not-ans); color: white; border-color: var(--not-ans); }
        .p-btn.answered { background: var(--ans); color: white; border-color: var(--ans); }
        .p-btn.review { background: var(--review); color: white; border-color: var(--review); }
        .p-btn.current { border: 2px solid var(--navy); }

        .p-submit { padding: 15px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="test-title" id="exam-title">Assessment Initialization</div>
        <div class="header-actions">
            <div class="timer-box" id="exam-timer">
                <i class="far fa-clock" style="font-size: 1.1rem;"></i> Time Left: --:--
            </div>
            <button class="top-submit-btn" onclick="confirmSubmit()">Submit Test</button>
        </div>
    </header>

    <div class="portal-body">
        <div class="q-panel">
            <div class="q-header">
                <span id="q-meta">Question 1</span>
                <span id="q-marks" style="color: #059669;">[Marks: +4, -1]</span>
            </div>
            
            <div class="q-content">
                <div class="q-text" id="q-text">Loading content securely...</div>
                <div id="q-options"></div>
            </div>

            <div class="q-footer">
                <div>
                    <button class="btn" onclick="clearResponse()" style="margin-right: 8px;">Clear Response</button>
                    <button class="btn" onclick="markForReview()">Mark for Review & Next</button>
                </div>
                <button class="btn btn-primary" onclick="saveAndNext()">Save & Next</button>
            </div>
        </div>

        <aside class="p-panel">
            <div class="p-info">
                <div><span class="badge" style="background: var(--ans);"></span> Answered</div>
                <div><span class="badge" style="background: var(--not-ans);"></span> Not Answered</div>
                <div><span class="badge" style="background: var(--review);"></span> Review</div>
                <div><span class="badge" style="background: var(--not-visited); border: 1px solid var(--border);"></span> Not Visited</div>
            </div>
            <div class="p-grid" id="palette-container"></div>
            <div class="p-submit">
                <button class="btn" onclick="confirmSubmit()" style="width: 100%; background: #0f172a; color: white;">Submit Assessment</button>
            </div>
        </aside>
    </div>

    <script type="module" src="js/portal-engine.js"></script>
</body>
</html>
