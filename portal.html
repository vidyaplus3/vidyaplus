<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assessment Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1d4ed8; --navy: #0f172a; --bg: #ffffff;
            --ans: #71d56b; --review: #9333ea; --not-visited: #f1f5f9; --not-ans: #f7252b;
            --border: #cbd5e1; --text: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100%; height: 100dvh; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; color: var(--text); font-size: 14px; }

        /* HEADER */
        header { background: #ffffff; padding: 12px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; flex-shrink: 0; }
        
        .header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .test-title { font-weight: 700; font-size: 1rem; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; flex-shrink: 0; }
        
        /* SLEEK DROPDOWN */
        .sleek-select {
            appearance: none;
            background: #f8fafc url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f172a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") no-repeat right 6px center;
            background-size: 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 24px 4px 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--navy);
            outline: none;
            cursor: pointer;
            max-width: 130px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sleek-select:focus { border-color: var(--primary); }

        .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .timer-box { font-weight: 700; font-size: 0.95rem; color: var(--navy); display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: #f8fafc; }
        .top-submit-btn { background: var(--navy); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .grid-toggle-btn { background: white; color: var(--navy); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: none; }

        /* MAIN LAYOUT */
        .portal-body { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        .q-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); background: white; }
        .q-header { padding: 12px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; font-weight: 600; flex-shrink: 0; }
        
        /* SLEEK QUESTION BADGE */
        .q-type-badge { font-size: 0.75rem; color: #64748b; font-weight: 500; margin-left: 5px; }

        .q-content { flex: 1; overflow-y: auto; padding: 20px 15px; }
        .q-text { font-size: 1.05rem; font-weight: 500; color: #000; line-height: 1.6; margin-bottom: 25px; word-wrap: break-word; }
        
        .option-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; cursor: pointer; background: white; transition: 0.1s; }
        .option-row:active { transform: scale(0.98); }
        .option-row.selected { border-color: var(--primary); background: #eff6ff; }
        .opt-radio { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); display: inline-block; flex-shrink: 0; margin-top: 2px; }
        .selected .opt-radio { background: var(--primary); border-color: var(--primary); box-shadow: inset 0 0 0 3px #eff6ff; }
        .num-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1.1rem; outline: none; }
        .num-input:focus { border-color: var(--primary); }

        /* FOOTER ACTIONS */
        .q-footer { padding: 10px 15px; border-top: 1px solid var(--border); background: white; display: flex; gap: 8px; flex-shrink: 0; z-index: 10; box-shadow: 0 -4px 10px rgba(0,0,0,0.02); }
        .btn { flex: 1; padding: 12px 5px; border: 1px solid var(--border); border-radius: 6px; font-weight: 700; cursor: pointer; background: #f8fafc; font-size: 0.85rem; color: var(--navy); display: flex; justify-content: center; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }

        /* RIGHT: PALETTE PANEL */
        .p-panel { width: 300px; display: flex; flex-direction: column; background: white; flex-shrink: 0; }
        .p-info { padding: 15px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.75rem; font-weight: 600; flex-shrink: 0; }
        .badge { width: 12px; height: 12px; display: inline-block; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
        
        .p-grid { padding: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; overflow-y: auto; flex: 1; align-content: start; }
        .p-btn { aspect-ratio: 1; border: 1px solid var(--border); background: white; font-weight: 600; font-size: 0.9rem; cursor: pointer; border-radius: 6px; }
        .p-btn.visited { background: var(--not-ans); color: white; border-color: var(--not-ans); }
        .p-btn.answered { background: var(--ans); color: white; border-color: var(--ans); }
        .p-btn.review { background: var(--review); color: white; border-color: var(--review); }
        .p-btn.current { border: 2px solid var(--navy); }

        .p-submit { padding: 15px; border-top: 1px solid var(--border); flex-shrink: 0; }
        .palette-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1999; display: none; }

        @media (max-width: 900px) {
            .grid-toggle-btn { display: flex; }
            .timer-text { display: none; } 
            .btn-text-hide { display: none; } 
            .p-panel { position: fixed; top: 0; right: -100%; height: 100%; height: 100dvh; z-index: 2000; box-shadow: -5px 0 25px rgba(0,0,0,0.1); transition: right 0.3s ease; }
            .p-panel.open { right: 0; }
            .palette-overlay.open { display: block; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="test-title" id="exam-title">Assessment</div>
            <select id="subject-selector" class="sleek-select" onchange="jumpToSubject(this.value)">
                <option value="">Loading...</option>
            </select>
        </div>
        <div class="header-actions">
            <div class="timer-box">
                <i class="far fa-clock"></i> <span class="timer-text">Time:</span> <strong id="timer-val">--:--</strong>
            </div>
            <button class="grid-toggle-btn" onclick="togglePalette()"><i class="fas fa-th-large"></i></button>
            <button class="top-submit-btn" onclick="confirmSubmit()">Submit Test</button>
        </div>
    </header>

    <div class="portal-body">
        <div class="q-panel">
            <div class="q-header">
                <div>
                    <span id="q-meta">Question 1</span>
                    <span id="q-type-badge" class="q-type-badge">(Single Correct)</span>
                </div>
                <span id="q-marks" style="color: #059669;">[+4, -1]</span>
            </div>
            
            <div class="q-content">
                <div class="q-text" id="q-text">Loading content...</div>
                <div id="q-options"></div>
            </div>

            <div class="q-footer">
                <button class="btn" onclick="clearResponse()"><i class="fas fa-eraser"></i> <span class="btn-text-hide">Clear</span></button>
                <button class="btn" onclick="markForReview()"><i class="fas fa-star" style="color: #a855f7;"></i> Review</button>
                <button class="btn btn-primary" onclick="saveAndNext()">Save & Next <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>

        <div class="palette-overlay" id="palette-overlay" onclick="togglePalette()"></div>

        <aside class="p-panel" id="p-panel">
            <div class="p-info">
                <div><span class="badge" style="background: var(--ans);"></span> Answered</div>
                <div><span class="badge" style="background: var(--not-ans);"></span> Not Answered</div>
                <div><span class="badge" style="background: var(--review);"></span> Review</div>
                <div><span class="badge" style="background: var(--not-visited); border: 1px solid var(--border);"></span> Not Visited</div>
            </div>
            <div class="p-grid" id="palette-container"></div>
            <div class="p-submit">
                <button class="btn" onclick="confirmSubmit()" style="width: 100%; background: #0f172a; color: white;">Final Submit</button>
            </div>
        </aside>
    </div>

    <script>
        window.togglePalette = function() {
            document.getElementById('p-panel').classList.toggle('open');
            document.getElementById('palette-overlay').classList.toggle('open');
        }
    </script>
    <script type="module" src="js/portal-engine.js"></script>
</body>
</html>
