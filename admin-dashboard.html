<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | VidyaPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --text: #1e293b; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { background: var(--bg); display: flex; min-height: 100vh; }

        /* --- SLIM SIDEBAR --- */
        .sidebar { width: 240px; background: var(--white); border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 10; }
        .sidebar-brand { padding: 1.5rem; font-size: 1.3rem; font-weight: 800; color: var(--primary); border-bottom: 1px solid #f1f5f9; }
        .nav-links { list-style: none; padding: 1rem; flex-grow: 1; }
        .nav-item { margin-bottom: 0.5rem; }
        .nav-link { display: flex; align-items: center; padding: 0.8rem 1rem; color: #64748b; text-decoration: none; border-radius: 10px; font-weight: 600; transition: 0.3s; }
        .nav-link i { margin-right: 12px; width: 20px; text-align: center; }
        .nav-link.active, .nav-link:hover { background: #eff6ff; color: var(--primary); }

        /* --- MAIN CONTENT --- */
        .main-content { margin-left: 240px; width: calc(100% - 240px); padding: 2rem; }
        .header-slim { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header-slim h2 { font-size: 1.5rem; font-weight: 700; color: var(--text); }

        .btn-add { background: var(--primary); color: white; padding: 0.7rem 1.5rem; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; border: none; cursor: pointer; transition: 0.3s; }
        .btn-add:hover { background: #1d4ed8; }
        .btn-add i { margin-right: 8px; }

        /* --- BATCH CARDS GRID --- */
        .batch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .batch-card { background: var(--white); border-radius: 15px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; transition: 0.3s; cursor: pointer; }
        .batch-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
        .batch-thumb { width: 100%; height: 160px; background: #e2e8f0; object-fit: cover; }
        .batch-info { padding: 1.2rem; }
        .batch-tag { font-size: 0.7rem; font-weight: 700; color: var(--primary); background: #eff6ff; padding: 0.3rem 0.7rem; border-radius: 20px; text-transform: uppercase; }
        .batch-title { font-size: 1.1rem; font-weight: 700; margin: 0.8rem 0 0.4rem 0; color: var(--text); }
        .batch-stats { font-size: 0.85rem; color: #64748b; display: flex; justify-content: space-between; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #f1f5f9; }

        /* --- MODAL (POPUP FORM) STYLES --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--white); padding: 2rem; border-radius: 15px; width: 100%; max-width: 500px; position: relative; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .close-modal { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b; }
        .modal-title { font-size: 1.3rem; font-weight: 700; color: var(--text); margin-bottom: 1.5rem; }
        
        .input-group { margin-bottom: 1.2rem; }
        .input-group label.main-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .input-group input[type="text"], .input-group input[type="url"] { width: 100%; padding: 0.8rem; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 0.95rem; }
        .input-group input:focus { border-color: var(--primary); outline: none; }
        
        /* CHECKBOX STYLES */
        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .check-label { font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #475569; background: #f8fafc; padding: 8px; border-radius: 8px; border: 1px solid #e2e8f0; transition: 0.2s; }
        .check-label:hover { background: #eff6ff; border-color: #bfdbfe; }
        
        .btn-submit { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; width: 100%; padding: 1rem; }
            .modal-content { width: 90%; padding: 1.5rem; }
            .checkbox-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">Admin Panel</div>
        <ul class="nav-links">
            <li class="nav-item"><a href="#" class="nav-link active"><i class="fas fa-layer-group"></i> Batches</a></li>
            <li class="nav-item"><a href="#" class="nav-link"><i class="fas fa-users"></i> Students</a></li>
            <li class="nav-item"><a href="#" class="nav-link"><i class="fas fa-chart-line"></i> Analytics</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="header-slim">
            <h2>Your Batches</h2>
            <button class="btn-add" id="open-modal-btn">
                <i class="fas fa-plus"></i> Create New Batch
            </button>
        </header>

        <div class="batch-grid" id="batches-container">
            <p style="color: #64748b;">Loading batches from server...</p>
        </div>
    </main>

    <div class="modal-overlay" id="batch-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn"><i class="fas fa-times"></i></button>
            <h3 class="modal-title">Launch New Batch</h3>
            
            <form id="add-batch-form">
                <div class="input-group">
                    <label class="main-label">Batch Name</label>
                    <input type="text" id="batch-name" placeholder="e.g. Target JEE 2026" required>
                </div>
                
                <div class="input-group">
                    <label class="main-label">Select Subjects</label>
                    <div class="checkbox-grid" id="batch-subjects">
                        <label class="check-label"><input type="checkbox" value="Physics"> Physics</label>
                        <label class="check-label"><input type="checkbox" value="Chemistry"> Chemistry</label>
                        <label class="check-label"><input type="checkbox" value="Maths"> Maths</label>
                        <label class="check-label"><input type="checkbox" value="Biology"> Biology</label>
                        <label class="check-label"><input type="checkbox" value="English"> English</label>
                        <label class="check-label"><input type="checkbox" value="Hindi"> Hindi</label>
                    </div>
                </div>

                <div class="input-group">
                    <label class="main-label">Thumbnail Image URL</label>
                    <input type="url" id="batch-image" placeholder="https://example.com/image.jpg" required>
                </div>
                <button type="submit" class="btn-submit" id="submit-btn">Save Batch</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-init.js';
        import { collection, getDocs, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const container = document.getElementById('batches-container');
        const modal = document.getElementById('batch-modal');
        const form = document.getElementById('add-batch-form');
        const submitBtn = document.getElementById('submit-btn');

        document.getElementById('open-modal-btn').addEventListener('click', () => modal.classList.add('active'));
        document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.remove('active'));
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Checkboxes se selected data nikalna
            let selectedSubjects = Array.from(document.querySelectorAll('#batch-subjects input:checked'))
                                        .map(cb => cb.value)
                                        .join(', ');
            
            if(!selectedSubjects) {
                alert("Please select at least one subject!");
                return;
            }

            const originalText = submitBtn.innerText;
            submitBtn.innerText = "Saving...";
            submitBtn.disabled = true;

            const batchData = {
                title: document.getElementById('batch-name').value,
                subject: selectedSubjects, // Yahan ab "Physics, English" aayega
                imageUrl: document.getElementById('batch-image').value,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "batches"), batchData);
                form.reset();
                modal.classList.remove('active');
                loadBatches();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error saving batch!");
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        });

        async function loadBatches() {
            try {
                const q = query(collection(db, "batches"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                container.innerHTML = ''; 

                if (querySnapshot.empty) {
                    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #64748b;">
                        <i class="fas fa-folder-open" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <p>No batches found. Create your first batch to get started!</p>
                    </div>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    // Substring lagaya taaki bahut saare subjects hone par card design na toote
                    let displaySubject = data.subject.length > 25 ? data.subject.substring(0, 25) + '...' : data.subject;
                    
                    const card = `
                        <div class="batch-card" onclick="window.location.href='admin-studio.html?id=${doc.id}'">
                            <img src="${data.imageUrl}" class="batch-thumb" alt="thumbnail" onerror="this.src='https://via.placeholder.com/300x160'">
                            <div class="batch-info">
                                <span class="batch-tag" title="${data.subject}">${displaySubject}</span>
                                <h3 class="batch-title">${data.title}</h3>
                                <div class="batch-stats">
                                    <span><i class="fas fa-video"></i> 0 Lectures</span>
                                    <span><i class="fas fa-tasks"></i> 0 DPPs</span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                console.error("Error loading batches:", error);
                container.innerHTML = '<p style="color: #ef4444;">Error loading batches.</p>';
            }
        }

        loadBatches();
    </script>
</body>
</html>
