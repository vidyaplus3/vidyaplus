<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vidyaplus | Advanced Academic Preparation</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0B1120; /* Deep Navy - Dark Mode Professional */
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.1);
            --sheet-bg: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; }

        /* 🌐 NAVBAR */
        .navbar { 
            position: fixed; top: 0; width: 100%; height: 70px; 
            background: rgba(11, 17, 32, 0.8); backdrop-filter: blur(15px);
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 6%; z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 1.4rem; font-weight: 900; letter-spacing: -1px; color: var(--text-main); }
        .logo span { color: var(--primary); }
        
        .btn-nav-auth { 
            background: var(--primary); color: white; padding: 10px 22px; 
            border-radius: 8px; font-weight: 700; border: none; cursor: pointer; transition: 0.3s;
        }

        /* 🌌 HERO SECTION */
        .hero { 
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; 
            padding: 0 10%; background: radial-gradient(circle at center, #1E293B 0%, #0B1120 100%);
        }
        .hero-badge {
            background: rgba(79, 70, 229, 0.1); color: var(--primary-light);
            padding: 6px 16px; border-radius: 30px; font-size: 0.75rem; font-weight: 800;
            border: 1px solid rgba(79, 70, 229, 0.3); margin-bottom: 25px; text-transform: uppercase;
        }
        .hero-title { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; line-height: 1; letter-spacing: -2px; margin-bottom: 20px; }
        .hero-subtitle { color: var(--text-muted); max-width: 600px; font-size: 1.1rem; line-height: 1.6; margin-bottom: 40px; }

        /* 📱 BOTTOM SHEET (The Magic) */
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px); z-index: 2000; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .sheet-overlay.active { opacity: 1; pointer-events: auto; }

        .bottom-sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: var(--sheet-bg); border-radius: 24px 24px 0 0;
            z-index: 2001; padding: 30px 25px; transition: 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            color: #0F172A; max-width: 500px; left: 50%; transform: translateX(-50%);
        }
        .bottom-sheet.active { bottom: 0; }
        
        .sheet-handle { width: 40px; height: 5px; background: #E2E8F0; border-radius: 10px; margin: 0 auto 25px; }
        
        .auth-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .auth-sub { color: #64748B; font-size: 0.9rem; margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #475569; margin-bottom: 6px; text-transform: uppercase; }
        .input-control { 
            width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid #E2E8F0;
            background: #F8FAFC; font-size: 1rem; outline: none; transition: 0.2s;
        }
        .input-control:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        .btn-auth { 
            width: 100%; padding: 16px; background: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-auth:active { transform: scale(0.98); }

        .btn-google {
            width: 100%; padding: 14px; background: white; color: #0F172A;
            border: 1.5px solid #E2E8F0; border-radius: 12px; font-weight: 700;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            margin-top: 15px; cursor: pointer;
        }

        .switch-text { text-align: center; margin-top: 25px; font-size: 0.9rem; color: #64748B; font-weight: 600; }
        .switch-link { color: var(--primary); cursor: pointer; text-decoration: underline; }

        #error-msg { color: #EF4444; font-size: 0.85rem; font-weight: 600; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">VIDYA<span>PLUS</span></div>
        <button class="btn-nav-auth" onclick="toggleSheet(true, 'login')">Login</button>
    </nav>

    <section class="hero">
        <div class="hero-badge">NTA Level Security Activated</div>
        <h1 class="hero-title">High Fidelity<br>Exam Prep.</h1>
        <p class="hero-subtitle">Experience India's most advanced behavioral telemetry and academic insights platform for JEE & NEET aspirants.</p>
        <button class="btn-nav-auth" style="padding: 18px 35px; font-size: 1rem;" onclick="toggleSheet(true, 'register')">Start Preparing Free</button>
    </section>

    <div class="sheet-overlay" id="sheetOverlay" onclick="toggleSheet(false)"></div>
    <div class="bottom-sheet" id="authSheet">
        <div class="sheet-handle"></div>
        <h2 class="auth-title" id="authTitle">Welcome Back</h2>
        <p class="auth-sub" id="authSub">Access your personalized learning dashboard.</p>
        
        <form id="authForm">
            <div class="input-group" id="nameGroup" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="regName" class="input-control" placeholder="Sudhir Anand">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="authEmail" class="input-control" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="authPass" class="input-control" placeholder="••••••••" required>
            </div>
            <div id="error-msg"></div>
            <button type="submit" class="btn-auth" id="submitBtn">Continue</button>
        </form>

        <div style="display: flex; align-items: center; margin: 20px 0;">
            <hr style="flex: 1; border: none; border-top: 1px solid #E2E8F0;">
            <span style="padding: 0 10px; font-size: 0.7rem; font-weight: 800; color: #94A3B8;">OR</span>
            <hr style="flex: 1; border: none; border-top: 1px solid #E2E8F0;">
        </div>

        <button class="btn-google">
            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" width="18">
            Continue with Google
        </button>

        <p class="switch-text" id="switchText">
            New to Vidyaplus? <span class="switch-link" onclick="setMode('register')">Create an account</span>
        </p>
    </div>

    <script type="module">
        import { auth, db } from './js/firebase-init.js';
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentMode = 'login';

        // UI FUNCTIONS
        window.toggleSheet = (show, mode = 'login') => {
            const sheet = document.getElementById('authSheet');
            const overlay = document.getElementById('sheetOverlay');
            if(show) {
                setMode(mode);
                sheet.classList.add('active');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            } else {
                sheet.classList.remove('active');
                overlay.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        };

        window.setMode = (mode) => {
            currentMode = mode;
            const isReg = mode === 'register';
            document.getElementById('authTitle').innerText = isReg ? "Create Account" : "Welcome Back";
            document.getElementById('authSub').innerText = isReg ? "Join the top 1% of serious aspirants." : "Access your personalized learning dashboard.";
            document.getElementById('nameGroup').style.display = isReg ? "block" : "none";
            document.getElementById('submitBtn').innerText = isReg ? "Create Account" : "Secure Login";
            document.getElementById('switchText').innerHTML = isReg 
                ? 'Already have an account? <span class="switch-link" onclick="setMode(\'login\')">Login instead</span>'
                : 'New to Vidyaplus? <span class="switch-link" onclick="setMode(\'register\')">Create an account</span>';
            document.getElementById('error-msg').style.display = "none";
        };

        // AUTH LOGIC (BANK LEVEL SECURITY)
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPass').value;
            const name = document.getElementById('regName').value;
            const errEl = document.getElementById('error-msg');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerText = "Authenticating...";
            errEl.style.display = "none";

            try {
                if (currentMode === 'register') {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                    // Securely initialize profile document with white-listed fields
                    await setDoc(doc(db, "users", userCredential.user.uid), {
                        name: name || email.split('@')[0],
                        email: email,
                        role: 'student',
                        enrolledBatches: [], // Initializing correctly
                        createdAt: new Date().toISOString()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
                window.location.href = "explore.html";
            } catch (error) {
                console.error(error);
                errEl.innerText = "Authentication Failed: " + error.message;
                errEl.style.display = "block";
                btn.disabled = false;
                btn.innerText = currentMode === 'register' ? "Create Account" : "Secure Login";
            }
        });
    </script>
</body>
</html>
