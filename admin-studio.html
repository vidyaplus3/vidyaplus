<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Studio | [BRAND_NAME]</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #6366f1; --secondary: #ec4899; --gradient: linear-gradient(135deg, #6366f1, #ec4899);
            --bg: #fafcff; --surface: #ffffff; --text: #0f172a; --text-light: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border-right: 1px solid #e2e8f0; position: fixed; height: 100vh; z-index: 10; }
        .sidebar-brand { padding: 2.5rem 1.5rem; font-size: 1.5rem; font-weight: 800; border-bottom: 1px solid #f1f5f9; }
        .brand-plus { color: var(--secondary); }
        .nav-links { list-style: none; padding: 1.5rem 1rem; }
        .nav-link { display: flex; align-items: center; padding: 1rem 1.2rem; color: var(--text-light); text-decoration: none; border-radius: 16px; font-weight: 600; transition: 0.3s; cursor: pointer; margin-bottom: 5px; }
        .nav-link:hover, .nav-link.active { background: rgba(99,102,241,0.08); color: var(--primary); }
        .nav-link i { margin-right: 12px; width: 20px; text-align: center; }

        /* Main Content */
        .main-content { margin-left: 260px; width: calc(100% - 260px); padding: 3rem 4rem; }
        .studio-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
        .studio-header h2 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }

        .batch-selector-card { background: var(--surface); padding: 1.5rem; border-radius: 24px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 20px; margin-bottom: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .form-select { flex: 1; padding: 0.9rem 1.2rem; border-radius: 30px; border: 1px solid #e2e8f0; font-weight: 600; outline: none; cursor: pointer; }
        .btn-prime { background: var(--gradient); color: white; padding: 0.9rem 1.8rem; border-radius: 30px; border: none; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(236,72,153,0.3); transition: 0.3s; }
        .btn-prime:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(236,72,153,0.4); }

        /* Studio Tree Engine UI */
        .tree-container { display: flex; flex-direction: column; gap: 20px; }
        .subject-group { background: var(--surface); border-radius: 24px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .subject-header { padding: 1.2rem 1.8rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
        .subject-title { font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }
        
        .chapter-box { padding: 1rem 1.8rem; border-bottom: 1px solid #f1f5f9; }
        .chapter-box:last-child { border-bottom: none; }
        .chapter-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .chapter-name::before { content: ''; width: 4px; height: 18px; background: var(--secondary); border-radius: 10px; }

        .content-list { display: flex; flex-direction: column; gap: 10px; padding-left: 15px; }
        .content-item { background: #fafcff; border: 1px solid #edf2f7; padding: 12px 18px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .content-item:hover { border-color: var(--primary); background: white; }
        .content-meta { display: flex; align-items: center; gap: 12px; }
        .icon-box { width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .icon-video { background: #fee2e2; color: #ef4444; }
        .icon-pdf { background: #eff6ff; color: #3b82f6; }
        .item-info h5 { font-size: 0.95rem; font-weight: 600; }
        .item-actions { display: flex; gap: 8px; }
        .btn-tiny { background: white; border: 1px solid #e2e8f0; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--text-light); transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-tiny:hover { color: var(--secondary); border-color: var(--secondary); }

        /* Modal Overrides */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.4); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .modal-overlay.active { display: flex; }
        .modal-card { background: white; padding: 2.5rem; border-radius: 30px; width: 100%; max-width: 550px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-light); }
        .input-group input, .input-group select { width: 100%; padding: 1rem; border-radius: 16px; border: 1px solid #e2e8f0; background: #f8fafc; outline: none; }
        .input-group input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
        
        /* Toast */
        #toast { position: fixed; bottom: 30px; right: 30px; background: white; padding: 1.2rem 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-left: 6px solid var(--primary); font-weight: 700; transform: translateX(150%); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 9999; }
        #toast.active { transform: translateX(0); }
    </style>
</head>
<body>

    <div id="toast">Message here</div>

    <aside class="sidebar">
        <div class="sidebar-brand">Studio<span class="brand-plus">PRO</span></div>
        <ul class="nav-links">
            <li class="nav-item"><a href="admin-dashboard.html" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a></li>
            <li class="nav-item"><a href="#" class="nav-link active"><i class="fas fa-photo-video"></i> Content Studio</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="studio-header">
            <h2>Content Studio</h2>
            <button class="btn-prime" onclick="openUploadModal()"><i class="fas fa-plus"></i> Upload Content</button>
        </header>

        <div class="batch-selector-card">
            <i class="fas fa-layer-group" style="color: var(--primary); font-size: 1.2rem;"></i>
            <select id="active-batch-select" class="form-select" onchange="loadStudioContent()">
                <option value="">Select a batch to manage content...</option>
            </select>
        </div>

        <div id="studio-tree-engine" class="tree-container">
            <div style="text-align: center; padding: 5rem; color: var(--text-light);">
                <i class="fas fa-folder-open fa-3x" style="opacity: 0.2; margin-bottom: 15px;"></i>
                <p>Select a batch to start managing subjects and lectures.</p>
             </div>
        </div>
    </main>

    <div class="modal-overlay" id="upload-modal">
        <div class="modal-card">
            <h3 style="margin-bottom: 2rem; font-weight: 800; font-size: 1.5rem;">Upload Study Material</h3>
            <form id="upload-form">
                <div class="input-group">
                    <label>Subject Name</label>
                    <input type="text" id="inp-subject" list="subject-list" placeholder="e.g. Physics" required>
                    <datalist id="subject-list"></datalist>
                </div>
                <div class="input-group">
                    <label>Chapter Name</label>
                    <input type="text" id="inp-chapter" list="chapter-list" placeholder="e.g. Electrostatics" required>
                    <datalist id="chapter-list"></datalist>
                </div>
                <div class="input-group">
                    <label>Lecture/Note Title</label>
                    <input type="text" id="inp-title" placeholder="e.g. Lecture 01 : Introduction" required>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="input-group" style="flex: 1;">
                        <label>YouTube Video URL</label>
                        <input type="text" id="inp-video" placeholder="Link (Optional)">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Google Drive PDF URL</label>
                        <input type="text" id="inp-pdf" placeholder="Link (Optional)">
                    </div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 1rem;">
                    <button type="button" class="btn-prime" style="background: #f1f5f9; color: #475569; box-shadow: none;" onclick="closeUploadModal()">Cancel</button>
                    <button type="submit" class="btn-prime" style="flex: 1;" id="btn-save-content">Save to Batch 🚀</button>
                </div>
            </form>
        </div>
    </div>
        <script type="module">
        import { db } from './js/firebase-init.js';
        import { collection, getDocs, addDoc, query, where, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Global State
        window.loadedBatches = [];
        window.currentMaterials = [];

        const batchSelect = document.getElementById('active-batch-select');
        const treeContainer = document.getElementById('studio-tree-engine');

        // Helper: Toast Notification
        window.showMsg = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 3000);
        };

        window.openUploadModal = () => {
            if(!batchSelect.value) return showMsg("Please select a batch first!");
            document.getElementById('upload-modal').classList.add('active');
        };
        window.closeUploadModal = () => document.getElementById('upload-modal').classList.remove('active');

        // 1. LOAD BATCHES INTO DROPDOWN
        async function fetchBatches() {
            const snap = await getDocs(collection(db, "batches"));
            batchSelect.innerHTML = '<option value="">Select a batch to manage content...</option>';
            snap.forEach(doc => {
                batchSelect.innerHTML += `<option value="${doc.id}">${doc.data().title}</option>`;
            });
        }

        // 2. LOAD & ENGINE RENDER
        window.loadStudioContent = async () => {
            const batchId = batchSelect.value;
            if(!batchId) return;

            treeContainer.innerHTML = `<div style="text-align:center; padding:5rem;"><i class="fas fa-spinner fa-spin fa-2x"></i><br><p>Building Content Tree...</p></div>`;

            try {
                // Fetch sub-collection 'materials' of the selected batch
                const matRef = collection(db, "batches", batchId, "materials");
                const snap = await getDocs(query(matRef));
                
                const tree = {};
                window.currentMaterials = [];
                const subSet = new Set();
                const chapSet = new Set();

                snap.forEach(docSnap => {
                    const data = { id: docSnap.id, ...docSnap.data() };
                    window.currentMaterials.push(data);
                    
                    const sub = data.subject || "General";
                    const chap = data.chapter || "Uncategorized";
                    
                    subSet.add(sub);
                    chapSet.add(chap);

                    if(!tree[sub]) tree[sub] = {};
                    if(!tree[sub][chap]) tree[sub][chap] = [];
                    tree[sub][chap].push(data);
                });

                // Update Datalists for smart typing
                document.getElementById('subject-list').innerHTML = Array.from(subSet).map(s => `<option value="${s}">`).join('');
                document.getElementById('chapter-list').innerHTML = Array.from(chapSet).map(c => `<option value="${c}">`).join('');

                renderTree(tree);

            } catch (err) {
                console.error(err);
                showMsg("Failed to load studio data.");
            }
        };

        function renderTree(tree) {
            if(Object.keys(tree).length === 0) {
                treeContainer.innerHTML = `<div style="text-align:center; padding:5rem; opacity:0.5;"><i class="fas fa-cloud-upload-alt fa-3x"></i><br><p>No content uploaded in this batch yet.</p></div>`;
                return;
            }

            treeContainer.innerHTML = '';
            for (const [subject, chapters] of Object.entries(tree)) {
                let subjectHTML = `
                    <div class="subject-group">
                        <div class="subject-header">
                            <span class="subject-title">${subject}</span>
                            <span style="font-size:0.7rem; color:var(--text-light); font-weight:700;">${Object.keys(chapters).length} CHAPTERS</span>
                        </div>`;
                
                for (const [chapter, items] of Object.entries(chapters)) {
                    subjectHTML += `
                        <div class="chapter-box">
                            <div class="chapter-name">${chapter}</div>
                            <div class="content-list">`;
                    
                    items.forEach(item => {
                        const isVideo = item.videoUrl ? true : false;
                        subjectHTML += `
                            <div class="content-item">
                                <div class="content-meta">
                                    <div class="icon-box ${isVideo ? 'icon-video' : 'icon-pdf'}">
                                        <i class="fas ${isVideo ? 'fa-video' : 'fa-file-pdf'}"></i>
                                    </div>
                                    <div class="item-info">
                                        <h5>${item.title}</h5>
                                    </div>
                                </div>
                                <div class="item-actions">
                                    <button class="btn-tiny" onclick="deleteContent('${item.id}')"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>`;
                    });

                    subjectHTML += `</div></div>`;
                }
                subjectHTML += `</div>`;
                treeContainer.innerHTML += subjectHTML;
            }
        }

        // 3. UPLOAD LOGIC
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const batchId = batchSelect.value;
            const btn = document.getElementById('btn-save-content');
            
            btn.innerText = "Uploading...";
            btn.disabled = true;

            const payload = {
                subject: document.getElementById('inp-subject').value,
                chapter: document.getElementById('inp-chapter').value,
                title: document.getElementById('inp-title').value,
                videoUrl: document.getElementById('inp-video').value,
                pdfUrl: document.getElementById('inp-pdf').value,
                status: "Active",
                createdAt: serverTimestamp()
            };

            try {
                const matRef = collection(db, "batches", batchId, "materials");
                await addDoc(matRef, payload);
                showMsg("Content Added Successfully!");
                closeUploadModal();
                document.getElementById('upload-form').reset();
                loadStudioContent(); // Refresh tree
            } catch (err) {
                showMsg("Upload failed.");
            } finally {
                btn.innerText = "Save to Batch 🚀";
                btn.disabled = false;
            }
        });

        // 4. DELETE LOGIC
        window.deleteContent = async (matId) => {
            if(!confirm("Are you sure you want to delete this lecture?")) return;
            const batchId = batchSelect.value;
            try {
                await deleteDoc(doc(db, "batches", batchId, "materials", matId));
                showMsg("Deleted.");
                loadStudioContent();
            } catch (err) { showMsg("Delete failed."); }
        };

        fetchBatches();
    </script>
</body>
</html>
