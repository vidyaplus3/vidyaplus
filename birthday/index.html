<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Pooja! 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-card">
        <h1 class="glow-text">Happy Birthday Pooja! 🎉</h1>
        <p class="subtitle"> this is your digital gift ! <br><span class="highlight-text">~ From Sudhir ✨</span></p>
        
        <button id="start-btn" class="pulse-btn">Tap to Unwrap Surprise 🎁</button>

        <div id="surprise-section" class="hidden">
            <!-- Audio File -->
            <audio id="bday-audio" src="geet.mp3" loop></audio>
            
            <!-- Optimized Photo Slider -->
            <div class="slider-container">
                <img id="slider-img" src="image/pooja1.png" alt="Memory" class="fade-anim">
            </div>

            <!-- Typewriter Special Message -->
            <div class="message-box">
                <p id="typewriter-text" class="success-text"></p>
            </div>
        </div>
    </div>

    <!-- Hardware Accelerated Confetti Container -->
    <div id="confetti-container"></div>

    <script src="script.js"></script>
</body>
</html>
